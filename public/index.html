<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JAILBREAK: CAMERA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#191919">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     PRISON, BUILT OUT OF NOVAPALS PARTS

     The app's *shapes* are all here — Lilita One for chrome and Nunito for
     prose, extruded buttons that press into their own bottom edge, hard
     rounded corners, cards on offset shadows, the halftone dot grid, hearts
     for lives. What is gone is the app's palette. Cyan-to-blue and coral
     read as a hub for six-year-olds, not as a man trying to get out of a
     cell, and every screen fought the artwork.

     So the surfaces come back to the original build's charcoal, retuned:
     --bg is #191919 exactly, because that is the background Chris exported
     the dioramas on. A square PNG dropped into the stage mount now has no
     visible edge at all — the art ends and the wall carries on.

     Everything saturated is an accent and there is only a handful of them:
     purple is the game's own colour (buttons, the logo, "you are here"),
     amber is time and attention, green is a pass, red is a fail. Nothing
     else gets to be bright.
     ===================================================================== */
  :root{
    /* the wall — a neutral ladder up from the artwork's own background */
    --bg:#191919;
    --panel:#232323;      /* cards, the stage mount, the code field */
    --panel-2:#2C2C2C;    /* something sitting on a card */
    --line:#3A3A3A;       /* every border */
    --edge:#0D0D0D;       /* the extrude and the type stroke */
    --ink:#ECECEC;
    --dim:#9A9A9A;

    /* accents, from the original build */
    --purple:#8B5CF6;  --purple-dk:#5B21B6;  --purple-lt:#C4A6FF;
    --green:#4ADE80;   --green-dk:#256F42;
    --red:#F87171;     --red-dk:#7F2F2F;
    --amber:#FBBF24;   --amber-dk:#8A6209;
    --blue:#3B82F6;
    --dead:#2E2E2E;    --dead-dk:#1C1C1C;

    --shadow:rgba(0,0,0,.55);
    --display:'Lilita One','Arial Black',system-ui,sans-serif;
    --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
    --r:20px;      /* cards */
    --r-btn:15px;  /* buttons */
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{height:100%;}
  body{
    min-height:100%; background:var(--bg); color:var(--ink);
    font-family:var(--body); font-weight:700;
    display:flex; align-items:center; justify-content:center;
    overflow-x:hidden;
    /* The app opens this as a fullscreen portrait webview, so there is no
       browser chrome between the page and the notch, the dynamic island or the
       home indicator. In a normal browser every inset is 0 and these collapse
       back to the plain numbers. */
    padding:
      max(18px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(26px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
  }
  /* The per-screen gradient survives the repaint, but as a tonal shift rather
     than a change of colour: a few points of hue over the charcoal, enough to
     tell you where you are without ever leaving the tone of the artwork.
     Purple where the game is talking to you, warm on a win, cold on a loss. */
  body{background-image:linear-gradient(180deg,#1F1F1F 0%,#141414 100%); background-attachment:fixed;}
  body[data-screen="title"]{background-image:linear-gradient(180deg,#2A2140 0%,#141419 100%);}
  body[data-screen="primer"],
  body[data-screen="gate"],
  body[data-screen="error"]{background-image:linear-gradient(180deg,#241C33 0%,#15151A 100%);}
  body[data-screen="intro"]{background-image:linear-gradient(180deg,#1D1A26 0%,#111111 100%);}
  body[data-screen="end"][data-outcome="win"]{background-image:linear-gradient(180deg,#2C2416 0%,#141310 100%);}
  body[data-screen="end"][data-outcome="lose"]{background-image:linear-gradient(180deg,#231619 0%,#121011 100%);}

  /* The app's halftone grid, dialled down to where it reads as concrete
     rather than as confetti. */
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:radial-gradient(circle,rgba(255,255,255,.05) 1.5px,transparent 1.6px) 0 0/15px 15px;
  }
  body[data-screen="title"]::before{
    background:
      repeating-linear-gradient(115deg,rgba(196,166,255,.045) 0 22px,transparent 22px 58px),
      radial-gradient(circle,rgba(255,255,255,.05) 1.5px,transparent 1.6px) 0 0/15px 15px;
  }

  #app{width:100%; max-width:460px; position:relative; z-index:1;}
  .screen{display:none; animation:rise .22s cubic-bezier(.2,.9,.3,1);}
  .screen.on{display:block;}
  @keyframes rise{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}

  /* ---------- type ---------- */
  .btn,.shutter,.hud,.load-title,.verdict,.prompt,.got,.clock .num,
  .loot h4,.err h3,.stage-ph .ph-name,.shot .stamp,.free,
  .cam-hint,.loot-hint,.code-input{
    font-family:var(--display); font-weight:400; text-transform:uppercase;
    letter-spacing:.5px;
  }
  h1,h2,h3,h4{font-weight:400;}

  /* ---------- buttons: the app's extruded pill, in the game's purple ---------- */
  .btn,.shutter{
    font-size:17px; color:#fff; background:var(--purple); border:0;
    border-radius:var(--r-btn); padding:16px 18px; width:100%; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:11px;
    box-shadow:0 5px 0 0 var(--purple-dk),0 9px 18px var(--shadow);
    text-shadow:0 2px 0 rgba(0,0,0,.35);
    transition:transform .07s ease,box-shadow .07s ease,filter .12s ease;
  }
  .btn:hover:not(:disabled),.shutter:hover:not(:disabled){filter:brightness(1.12);}
  .btn:active:not(:disabled),.shutter:active:not(:disabled){
    transform:translateY(4px);
    box-shadow:0 1px 0 0 var(--purple-dk),0 3px 8px var(--shadow);
  }
  .btn:disabled,.shutter:disabled{
    background:var(--dead); color:var(--dim); box-shadow:0 5px 0 0 var(--dead-dk);
    cursor:default; text-shadow:none;
  }
  .btn.big{font-size:21px; padding:19px;}
  /* The shutter is the one green thing on the camera screen: it is the go. */
  .shutter{
    margin-top:15px; font-size:20px; padding:20px; color:var(--edge);
    background:var(--green); box-shadow:0 5px 0 0 var(--green-dk),0 9px 18px var(--shadow);
    text-shadow:none;
  }
  .shutter:active:not(:disabled){box-shadow:0 1px 0 0 var(--green-dk),0 3px 8px var(--shadow);}
  .shutter .lens{width:18px; height:18px; border-radius:50%; border:4px solid var(--edge); flex:none;}
  /* A second-choice button: the unpicked option, dark instead of the app's white. */
  .btn.ghost{
    background:var(--panel-2); color:var(--dim); font-size:14px;
    box-shadow:0 4px 0 0 var(--edge),0 6px 12px var(--shadow);
    text-shadow:none;
  }
  .btn.ghost:hover:not(:disabled){color:var(--ink); filter:none; background:#343434;}
  .btn.ghost:active:not(:disabled){box-shadow:0 1px 0 0 var(--edge);}

  /* ---------- title ----------
     No logo, no tagline: this only ever gets a tap-through from the NovaPals
     webview, so the "title screen" is just the language question — reusing
     .tag's readable body-font styling rather than the blocky display font,
     since it's a sentence to read rather than a piece of chrome. */
  #screen-title{text-align:center; padding:56px 0;}
  .tag{
    font-size:19px; line-height:1.5; color:var(--ink); font-weight:800;
    margin-bottom:22px; padding:0 10px;
  }
  .blink{animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:.25}}

  /* ---------- HUD ---------- */
  .hud{
    display:flex; justify-content:space-between; align-items:center;
    font-size:14px; color:var(--dim); margin-bottom:12px; gap:10px;
  }
  .hud .scene{text-align:right; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--purple-lt);}

  /* Attempts as hearts — kept from the app pass, recoloured. */
  .tally{display:flex; gap:4px; flex:none; align-items:center;}
  .mark{width:24px; height:24px; flex:none; color:var(--red); filter:drop-shadow(0 2px 0 var(--edge));}
  .mark.now{animation:beat 1s ease-in-out infinite;}
  .mark.spent{color:#333; filter:none;}
  @keyframes beat{0%,100%{transform:scale(1)}45%{transform:scale(1.18)}}

  /* ---------- stage art ----------
     The mount is #191919, the same as the PNGs' own background, so a square
     diorama has no visible edge inside it. The 1px line is what says "frame". */
  .stage{
    position:relative; border-radius:var(--r); overflow:hidden;
    background:var(--bg); padding:5px; border:1px solid var(--line);
    box-shadow:0 8px 0 0 var(--edge),0 16px 30px var(--shadow);
  }
  .stage img{display:block; width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:15px;}

  /* Holding frame until assets/stage-N.png exists. */
  .stage-ph{
    aspect-ratio:1/1; border-radius:15px; display:flex; align-items:center;
    justify-content:center; position:relative;
    background:
      repeating-linear-gradient(90deg,rgba(58,58,58,.9) 0 12px,transparent 12px 46px),
      linear-gradient(180deg,#242424 0%,#171717 100%);
  }
  .stage-ph .ph-name{font-size:22px; color:var(--purple-lt); text-align:center; padding:0 24px; line-height:1.25;}
  .stage-ph .ph-note{position:absolute; bottom:12px; right:14px; font-family:var(--body); font-size:11px; color:#555;}

  /* The punk's line. White, because it is the one voice in the game and it
     has to cut through a dark photograph. */
  .bubble{
    position:absolute; left:16px; right:16px; bottom:16px; z-index:3;
    background:#fff; color:#15151B; border-radius:16px;
    padding:14px 16px; font-family:var(--body); font-weight:800;
    font-size:16px; line-height:1.4;
    box-shadow:0 5px 0 var(--edge),0 12px 24px rgba(0,0,0,.6);
  }
  .bubble::after{
    content:''; position:absolute; left:28px; bottom:-11px;
    border:7px solid transparent; border-top-color:#fff;
  }
  /* ---------- vocabulary support ----------
     The two words each stage teaches are bold so they get noticed, and tappable
     so the meaning costs one deliberate action rather than none. The gloss lands
     BESIDE the English, never instead of it — the mapping between the two is the
     thing being learned, and a learner who only ever sees their own language has
     been given comprehension instead of vocabulary. */
  .key{
    font-weight:800; color:#5B21B6; cursor:pointer;
    border-bottom:2px dotted rgba(91,33,182,.45);
  }
  .key.open{border-bottom-color:transparent;}
  .key .gloss{font-weight:700; color:#6B4FA8; font-style:italic;}
  /* The whole line, one more tap away and one step quieter. Deliberately not a
     big button: at this level the English should be the path of least
     resistance, with this here for when it genuinely is not enough. */
  .assist{
    display:flex; gap:10px; justify-content:center; align-items:center;
    margin-top:12px; flex-wrap:wrap;
  }
  .assist button{
    font-family:var(--body); font-weight:800; font-size:12px;
    letter-spacing:.4px; text-transform:uppercase;
    background:none; border:0; color:var(--dim); cursor:pointer;
    padding:7px 10px; border-radius:9px; border:1px solid var(--line);
  }
  .assist button:active{transform:translateY(2px);}
  .assist button.on{color:var(--purple-lt); border-color:var(--purple-dk);}
  /* Sits under the English inside the bubble, smaller and dimmer, so the eye
     still lands on the English first. */
  .local{
    display:block; margin-top:9px; padding-top:9px;
    border-top:1px dashed rgba(22,34,74,.22);
    font-size:14px; font-weight:700; color:#4A4A6A; font-style:italic;
  }

  /* Set when we have proved there is no speech engine and no app to ask. A
     tap-to-hear icon that cannot do anything is worse than no icon. */
  body.no-speech .say{display:none;}
  [data-say]{cursor:pointer;}
  [data-say]:active{transform:translateY(2px);}
  .say{opacity:.4; font-size:.8em; margin-left:7px; transition:opacity .12s;}
  [data-say]:hover .say{opacity:.9;}

  /* ---------- panels + copy ---------- */
  .below{padding:18px 0 0;}
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    padding:22px 18px; box-shadow:0 8px 0 0 var(--edge),0 16px 30px var(--shadow);
  }
  .prompt{font-size:14px; color:var(--dim); margin-bottom:12px; text-align:center;}
  .read{
    font-family:var(--body); font-weight:700; font-size:16px; line-height:1.55;
    color:var(--ink);
  }
  .read + .read{margin-top:12px;}
  .read.small{font-size:14px; color:var(--dim);}

  /* ---------- the intro beats ----------
     Two stills before the first cell. Same mount and same speech bubble as a
     stage, so the intro reads as part of the game rather than as a cutscene
     bolted on the front, plus a pair of pips saying how much of it is left. */
  .beats{display:flex; gap:8px; justify-content:center; margin-top:16px;}
  .beat-pip{
    width:34px; height:6px; border-radius:99px; background:#333;
    transition:background .2s;
  }
  .beat-pip.on{background:var(--purple);}

  /* ---------- camera ---------- */
  .cam{
    position:relative; border-radius:var(--r); overflow:hidden; background:#0D0D0D;
    box-shadow:0 8px 0 0 var(--edge),0 16px 30px var(--shadow);
    border:5px solid var(--line);
  }
  .cam video{display:block; width:100%; aspect-ratio:3/4; object-fit:cover; background:#0D0D0D;}
  .cam .frame{
    position:absolute; inset:96px 20px 20px; pointer-events:none; z-index:2;
    border:3px dashed rgba(255,255,255,.5); border-radius:14px;
  }
  .cam.timed .frame{bottom:60px;}
  .cam .frame::before,.cam .frame::after{
    content:''; position:absolute; width:26px; height:26px; border:5px solid var(--amber); border-radius:6px;
  }
  .cam .frame::before{top:-5px; left:-5px; border-right:0; border-bottom:0; border-radius:8px 0 0 0;}
  .cam .frame::after{bottom:-5px; right:-5px; border-left:0; border-top:0; border-radius:0 0 8px 0;}
  /* The ask sits on a white card over the feed — dark text on white is the
     only thing guaranteed legible against whatever the camera is pointing at. */
  .cam .ask{
    position:absolute; left:12px; right:12px; top:12px; z-index:3;
    background:#fff; color:#15151B; border-radius:13px;
    padding:11px 13px; font-family:var(--body); font-weight:800;
    font-size:15px; line-height:1.35;
    box-shadow:0 4px 0 var(--edge);
  }
  .cam-hint{text-align:center; font-size:12px; color:var(--dim); margin-top:13px;}

  /* ---------- the shot clock ---------- */
  .clock{
    position:absolute; left:10px; right:10px; bottom:10px; z-index:4; height:40px;
    background:rgba(13,13,13,.88); border:1px solid var(--line); border-radius:13px;
    display:flex; align-items:center; gap:11px; padding:0 13px;
  }
  .clock .num{font-size:20px; color:var(--ink); flex:none; min-width:30px; text-align:center;}
  .clock .rail{flex:1; height:12px; background:#000; border-radius:99px; overflow:hidden;}
  .clock .fill{
    display:block; height:100%; width:100%; border-radius:99px;
    background:var(--green); transition:width .95s linear;
  }
  .clock.warn .num{color:var(--amber);}
  .clock.warn .fill{background:var(--amber);}
  .clock.hot .num{color:var(--red); animation:blink .5s steps(1) infinite;}
  .clock.hot .fill{background:var(--red);}

  /* ---------- the photo, being judged ---------- */
  .shot{
    position:relative; border-radius:var(--r); overflow:hidden;
    background:var(--bg); padding:5px; border:1px solid var(--line);
    box-shadow:0 8px 0 0 var(--edge),0 16px 30px var(--shadow);
  }
  .shot img{display:block; width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:15px;}
  .shot.busy::after{
    content:''; position:absolute; left:5px; right:5px; height:40%; z-index:2; border-radius:15px;
    background:linear-gradient(180deg,transparent,rgba(139,92,246,.28) 60%,rgba(196,166,255,.55));
    animation:scan 1.3s ease-in-out infinite;
  }
  @keyframes scan{0%{top:-40%}100%{top:100%}}
  .shot .stamp{
    position:absolute; left:16px; right:16px; bottom:16px; z-index:3;
    padding:12px; border-radius:13px; font-size:17px; text-align:center; color:var(--edge);
    background:var(--ink); box-shadow:0 4px 0 var(--edge);
  }
  .shot .stamp.pass{background:var(--green);}
  .shot .stamp.fail{background:var(--red);}
  .shot .stamp.soft{background:var(--amber);}
  .shot.empty{
    aspect-ratio:3/4; display:flex; align-items:center; justify-content:center; border-radius:15px;
    background:
      repeating-linear-gradient(90deg,rgba(58,58,58,.9) 0 12px,transparent 12px 46px),
      linear-gradient(180deg,#242424 0%,#171717 100%);
  }
  .shot.empty .none{font-family:var(--display); font-size:20px; color:var(--dim); letter-spacing:2px;}

  .load-title{font-size:26px; color:var(--ink); text-align:center; margin-bottom:16px;}
  .load-note{
    font-family:var(--body); font-weight:700; font-size:15px; color:var(--dim);
    text-align:center; min-height:34px; line-height:1.6; margin-top:14px;
  }
  .free{font-size:13px; color:var(--amber); margin-top:12px; text-align:center;}

  /* ---------- endings ---------- */
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    padding:26px 20px; text-align:center;
    box-shadow:0 8px 0 0 var(--edge),0 16px 30px var(--shadow);
  }
  .card .verdict{font-size:46px; line-height:1.05; margin-bottom:12px; color:var(--ink);}
  .card .verdict.win{color:var(--green); -webkit-text-stroke:4px var(--edge); paint-order:stroke fill;}
  .card .verdict.lose{color:var(--red); -webkit-text-stroke:4px var(--edge); paint-order:stroke fill;}
  .card .got{
    font-size:14px; color:var(--edge); background:var(--amber); display:inline-block;
    margin-top:16px; padding:8px 15px; border-radius:99px;
    box-shadow:0 3px 0 var(--amber-dk);
  }
  .card .got:empty{display:none;}

  .loot{margin-top:22px; border-top:1px solid var(--line); padding-top:18px; text-align:left;}
  .loot h4{font-size:17px; color:var(--ink); margin-bottom:4px;}
  .loot-hint{font-size:11px; color:var(--dim); margin-bottom:14px;}
  .loot-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .loot-item{
    background:var(--panel-2); border:1px solid var(--line); border-radius:14px;
    padding:11px 13px; text-align:left; color:var(--ink); cursor:pointer;
    font-family:var(--body); font-weight:700;
    box-shadow:0 3px 0 var(--edge);
    transition:transform .07s ease,box-shadow .07s ease,background .12s;
  }
  .loot-item:hover{background:#343434;}
  .loot-item:active{transform:translateY(3px); box-shadow:0 0 0 var(--edge);}
  .loot-item .where{
    display:block; font-family:var(--display); text-transform:uppercase;
    font-size:11px; color:var(--purple-lt); letter-spacing:.6px;
  }
  .loot-item .what{display:block; margin-top:5px; font-size:15px; line-height:1.35; word-break:break-word;}
  /* The words the stage was teaching, under the object that satisfied them. */
  .loot-item .learned{
    display:block; margin-top:7px; padding-top:6px;
    border-top:1px solid rgba(255,255,255,.07);
    font-family:var(--display); text-transform:uppercase; letter-spacing:.5px;
    font-size:12px; color:var(--green);
  }

  /* ---------- language picker ---------- */
  .langs{display:flex; gap:7px; justify-content:center; margin-top:11px; flex-wrap:wrap;}
  .lang-chip{
    font-family:var(--body); font-weight:800; font-size:13px;
    background:var(--panel-2); color:var(--dim); border:1px solid var(--line);
    border-radius:11px; padding:10px 14px; cursor:pointer;
    box-shadow:0 3px 0 var(--edge);
    transition:transform .07s ease,box-shadow .07s ease;
  }
  .lang-chip:active{transform:translateY(3px); box-shadow:0 0 0 var(--edge);}
  /* Selected is the game's purple, the way a picked option is orange in the app. */
  .lang-chip.on{background:var(--purple); border-color:var(--purple-lt); color:#fff; box-shadow:0 3px 0 var(--purple-dk);}

  /* ---------- gate + error ---------- */
  .err{text-align:left;}
  .err h3{font-size:22px; color:var(--red); margin-bottom:14px; text-align:center;}
  .err pre{
    font-family:var(--body); font-weight:700; font-size:13px; line-height:1.6;
    color:var(--dim); white-space:pre-wrap; word-break:break-word;
    background:#151515; border:1px solid var(--line);
    padding:13px; border-radius:12px; margin-bottom:16px;
    max-height:190px; overflow:auto;
  }
  .code-input{
    font-size:26px; letter-spacing:8px; text-align:center; width:100%;
    padding:16px 12px; color:var(--ink); background:#151515;
    border:1px solid var(--line); border-radius:14px; outline:none;
    box-shadow:0 4px 0 var(--edge);
  }
  .code-input:focus{border-color:var(--purple); box-shadow:0 4px 0 var(--purple-dk);}
  .code-err{min-height:22px; margin-top:12px; font-size:14px; color:var(--red); font-family:var(--body); font-weight:800; text-align:center;}

  /* ---------- chrome ---------- */
  .mute{
    position:fixed; z-index:1000; width:44px; height:44px;
    top:calc(14px + env(safe-area-inset-top)); right:calc(14px + env(safe-area-inset-right));
    border:1px solid var(--line); border-radius:50%; background:var(--panel-2);
    color:var(--ink); font-size:17px; cursor:pointer; box-shadow:0 4px 0 var(--edge);
    display:flex; align-items:center; justify-content:center;
  }
  .mute:active{transform:translateY(3px); box-shadow:0 1px 0 var(--edge);}

  /* Something went wrong but the run is fine — says so and gets out of the way. */
  .toast{
    position:fixed; left:16px; right:16px; bottom:16px; z-index:1001; max-width:428px;
    margin:0 auto; padding:14px 16px; background:var(--panel-2); color:var(--ink);
    border:1px solid var(--line); border-radius:15px;
    font-family:var(--body); font-weight:800; font-size:14px;
    line-height:1.45; text-align:center;
    box-shadow:0 5px 0 var(--amber-dk),0 12px 24px rgba(0,0,0,.7);
    animation:rise .2s ease;
  }
  .toast.hide{display:none !important;}
  .gap{margin-top:14px;}
  .hide{display:none !important;}

  @media (max-width:420px){
    .logo .l2{font-size:50px;}
    .card .verdict{font-size:38px;}
    .loot-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<button class="mute" id="mute" title="Toggle sound">🔊</button>

<div id="app">

  <!-- ================= ACCESS GATE ================= -->
  <section id="screen-gate" class="screen">
    <div class="panel">
      <div class="load-title" data-t="gate_title">RESTRICTED AREA</div>
      <div class="prompt" data-t="gate_hint">ACCESS CODE</div>
      <input id="code" class="code-input" type="password" autocomplete="off" inputmode="text" maxlength="40">
      <div class="code-err" id="code-err"></div>
      <button class="btn big gap" id="unlock" data-t="gate_go">UNLOCK</button>
    </div>
  </section>

  <!-- ================= TITLE =================
       No logo, no tagline, no separate start button: this only ever gets a
       tap-through from the NovaPals webview, so there's nothing to sell. The
       only decision left is which language to see hints in, and tapping a
       chip both sets it and starts the run in one action. -->
  <section id="screen-title" class="screen on">
    <div class="tag" data-t="lang_prompt">WANT HINTS IN YOUR LANGUAGE?</div>
    <div class="langs" id="langs"></div>
  </section>

  <!-- ================= CAMERA PRIMER =================
       The real browser prompt is never fired cold. A denied camera permission
       is close to unrecoverable on iOS Safari, so the player is told what is
       about to be asked and why before they are asked it. -->
  <section id="screen-primer" class="screen">
    <div class="panel">
      <div class="load-title" data-t="cam_title">CAMERA CHECK</div>
      <p class="read" data-t="cam_why"></p>
      <p class="read small gap" data-t="cam_privacy"></p>
      <button class="btn big gap" id="allow" data-t="cam_allow">TURN ON THE CAMERA</button>
      <div id="primer-fallback" class="hide">
        <p class="read small gap" data-t="cam_denied"></p>
        <button class="btn ghost gap" id="pick-instead" data-t="cam_pick">CHOOSE A PHOTO</button>
        <button class="btn ghost gap" id="cam-retry" data-t="cam_retry">TRY THE CAMERA AGAIN</button>
      </div>
    </div>
  </section>

  <!-- ================= INTRO =================
       Two stills that set up why he wants out at all. Built out of the same
       parts as a stage brief — mount, speech bubble, one button — because the
       intro is the game teaching you how it talks, not a cutscene. -->
  <section id="screen-intro" class="screen">
    <div class="stage" id="intro-art"></div>
    <div class="below">
      <div class="beats" id="intro-beats"></div>
      <button class="btn big gap" id="intro-go" data-t="intro_next">NEXT</button>
      <button class="btn ghost gap" id="intro-skip" data-t="intro_skip">SKIP THE INTRO</button>
    </div>
  </section>

  <!-- ================= STAGE BRIEF ================= -->
  <section id="screen-brief" class="screen">
    <div class="hud">
      <span id="brief-stage">STAGE 1/7</span>
      <span class="tally" id="brief-tally"></span>
      <span class="scene" id="brief-scene"></span>
    </div>
    <div class="stage" id="brief-art"></div>
    <div class="below">
      <!-- The whole line in the child's own language, one tap away. Built only
           when there is a translation for the run's language. -->
      <div class="assist" id="brief-assist"></div>
      <button class="btn big gap" id="brief-go" data-t="brief_go">OPEN CAMERA</button>
    </div>
  </section>

  <!-- ================= CAMERA ================= -->
  <section id="screen-cam" class="screen">
    <div class="hud">
      <span id="cam-stage">STAGE 1/7</span>
      <span class="tally" id="cam-tally"></span>
      <span class="scene" id="cam-scene"></span>
    </div>
    <div class="cam">
      <video id="video" playsinline muted autoplay></video>
      <div class="frame"></div>
      <div class="ask" id="cam-ask" data-say></div>
      <div class="clock hide" id="clock">
        <span class="num" id="clock-num">15</span>
        <span class="rail"><span class="fill" id="clock-fill"></span></span>
      </div>
    </div>
    <button class="shutter" id="shoot"><span class="lens"></span><span data-t="cam_shoot">SHOOT IT</span></button>
    <div class="cam-hint" data-t="cam_hint">HOLD IT UP AND FILL THE FRAME</div>
    <div class="assist" id="cam-assist"></div>
    <button class="btn ghost gap" id="use-file" data-t="cam_switch">PICK A PHOTO INSTEAD</button>
  </section>

  <!-- ================= JUDGING ================= -->
  <section id="screen-judge" class="screen">
    <div class="load-title" data-t="judging">DEVELOPING</div>
    <div class="shot busy" id="judge-shot"></div>
    <div class="load-note" id="judge-note"></div>
  </section>

  <!-- ================= VERDICT ================= -->
  <section id="screen-verdict" class="screen">
    <div class="hud">
      <span id="v-stage">STAGE 1/7</span>
      <span class="tally" id="v-tally"></span>
      <span class="scene" id="v-scene"></span>
    </div>
    <div class="shot" id="v-shot"></div>
    <div class="below">
      <p class="read" id="v-line" data-say></p>
      <div class="free hide" id="v-free" data-t="free_retry">FREE GO — THAT ONE DIDN’T COUNT</div>
      <button class="btn big gap" id="v-go">GO AGAIN</button>
    </div>
  </section>

  <!-- ================= ENDING ================= -->
  <section id="screen-end" class="screen">
    <div class="panel card">
      <div class="verdict" id="end-verdict"></div>
      <p class="read" id="end-line" data-say></p>
      <p class="read small gap" id="end-sub"></p>
      <div class="got" id="end-got"></div>
      <div class="loot" id="end-loot">
        <h4 data-t="evidence_title">THE EVIDENCE</h4>
        <div class="loot-hint" data-t="evidence_tap">WHAT YOU ACTUALLY HANDED HIM</div>
        <div class="loot-grid" id="end-grid"></div>
      </div>
      <!-- Inside the app the run ends by completing the quest, so FINISH is the
           primary action there and GO AGAIN is demoted to a second choice. In a
           plain browser there is no quest to complete: FINISH stays hidden and
           GO AGAIN is the only button, exactly as before. -->
      <button class="btn big gap hide" id="end-finish" data-t="finish">FINISH</button>
      <button class="btn big gap" id="end-again" data-t="restart">GO AGAIN</button>
    </div>
  </section>

  <!-- ================= ERROR ================= -->
  <section id="screen-error" class="screen">
    <div class="panel err">
      <h3 id="err-title" data-t="err_system">SYSTEM ERROR</h3>
      <pre id="err-body"></pre>
      <button class="btn big" id="err-again" data-t="err_new">START A NEW RUN</button>
    </div>
  </section>

</div>

<!-- The capture path. The file input is both the no-camera fallback and, on
     mobile, a second route to the native camera; capture="environment" makes
     the phone open the rear camera rather than the gallery. -->
<div class="toast hide" id="toast"></div>

<input type="file" id="file" accept="image/*" capture="environment" class="hide">
<canvas id="canvas" class="hide"></canvas>

<!-- Interface strings. A plain script tag, so it is guaranteed to be in place
     before the game script runs; if it fails to load the game falls back to a
     small built-in English set rather than breaking. -->
<script src="/i18n.js"></script>
<script>
/* =========================================================================
   CHIPTUNE — everything is synthesised in WebAudio. No audio files.
   ========================================================================= */
const Chip = (() => {
  let ctx = null, master = null, muted = false;
  let loadingTimer = null, themeTimer = null;
  // Every voice scheduled but not yet finished. WebAudio has no "cancel that
  // note" once start() is called with a future time, so a several-second piece
  // would otherwise play on over whatever the player does next — press GO AGAIN
  // two seconds into the lament and it follows you into the new run.
  let pending = [];

  const N = {}; // note name -> frequency
  (() => {
    const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    for (let oct = 1; oct <= 7; oct++)
      names.forEach((n, i) => { N[n + oct] = 440 * Math.pow(2, ((oct - 4) * 12 + i - 9) / 12); });
  })();

  function boot() {
    if (ctx) return ctx;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 0.30;
    master.connect(ctx.destination);
    return ctx;
  }

  /** One chiptune voice at an absolute AudioContext time. */
  function voiceAt(freq, t, dur, { type = 'square', vol = 0.5, slide = 0, vibrato = 0 } = {}) {
    if (!ctx || muted || !freq) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
    if (vibrato) {
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = 6.5; lg.gain.value = vibrato;
      lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t + dur);
      // The LFO needs registering too, or hush() stops the note it modulates and
      // leaves its modulator running — silent, but a node that outlives its job.
      remember(lfo, lg, t + dur);
    }
    // square-wave envelope: instant attack, tiny decay, hard cut
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(vol * 0.62, t + dur * 0.45);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
    remember(o, g, t + dur + 0.02);
  }
  /** Same, but relative to "now" — what the one-shots and the theme use. */
  function voice(freq, at, dur, opts) { if (ctx) voiceAt(freq, ctx.currentTime + at, dur, opts); }

  /** White-noise burst — the drum kit. */
  function noiseAt(t, dur, { vol = 0.25, hp = 1200 } = {}) {
    if (!ctx || muted) return;
    const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t);
    remember(src, g, t + dur + 0.02);
  }
  function noise(at, dur, opts) { if (ctx) noiseAt(ctx.currentTime + at, dur, opts); }

  function remember(node, gain, endsAt) {
    pending.push({ node, gain, endsAt });
    // Sweep the finished ones occasionally rather than on every note.
    if (pending.length > 300) pending = pending.filter(p => p.endsAt > ctx.currentTime);
  }

  /**
   * Cut everything still sounding or queued, over 30ms so it fades rather than
   * clicks. Called when a run starts and when the sound is muted, which are the
   * two moments a piece from the previous screen would otherwise bleed through.
   */
  function hush() {
    if (!ctx) return;
    const now = ctx.currentTime;
    for (const p of pending) {
      try {
        p.gain.gain.cancelScheduledValues(now);
        p.gain.gain.setValueAtTime(p.gain.gain.value, now);
        p.gain.gain.linearRampToValueAtTime(0.0001, now + 0.03);
        p.node.stop(now + 0.04);
      } catch { /* already finished; nothing to cut */ }
    }
    pending = [];
  }

  /* ---- the title fanfare: heroic, dumb, in D major, ~150bpm ---- */
  const B = 0.4 / 2; // one eighth note
  const LEAD = [
    // [note, beat, length]
    ['D5',0,1],['F#5',1,1],['A5',2,1],['D6',3,2],
    ['C#6',5,1],['D6',6,4],
    ['A5',11,1],['B5',12,1],['C#6',13,1],['D6',14,2],
    ['A5',16,1],['D6',17,1],['F#6',18,1],['A6',19,3],
    ['G6',22,1],['F#6',23,1],['E6',24,1],['D6',25,5],
    [null,30,2],
  ];
  const BASS = [
    ['D3',0,2],['D3',2,2],['A2',4,2],['A2',6,2],
    ['B2',8,2],['B2',10,2],['F#2',12,2],['F#2',14,2],
    ['G2',16,2],['G2',18,2],['A2',20,2],['A2',22,2],
    ['D3',24,2],['A2',26,2],['D3',28,4],
  ];
  const BAR = 32 * B;

  function themeOnce(offset = 0) {
    LEAD.forEach(([n, b, l]) => voice(N[n], offset + b * B, l * B * 0.92, { type: 'square', vol: 0.34, vibrato: l >= 3 ? 5 : 0 }));
    BASS.forEach(([n, b, l]) => voice(N[n], offset + b * B, l * B * 0.9, { type: 'triangle', vol: 0.42 }));
    for (let i = 0; i < 32; i += 2) noise(offset + i * B, 0.05, { vol: i % 8 === 4 ? 0.3 : 0.13, hp: i % 8 === 4 ? 900 : 3000 });
  }

  function startTheme() {
    boot(); stopTheme();
    themeOnce(0.05);
    themeTimer = setInterval(() => themeOnce(0.02), BAR * 1000);
  }
  function stopTheme() { clearInterval(themeTimer); themeTimer = null; }

  /* ------------------------------------------------------------------
     LOADING TRACK — D minor, 138bpm. Three layers that arrive in turn,
     so a wait of any length has somewhere to go:

       bar 1   ostinato alone
       bar 7   melody enters (~5s in) and the ostinato ducks
       bar 17  chord stabs land on top (~14s in), ostinato ducks further

     Most turns take 15-25s, so a typical wait hears all three; a quick
     one still gets the melody, which the old 16-bar entry point missed
     almost every time. Scheduled with a lookahead against absolute
     AudioContext time, so it stays locked to the beat instead of drifting.
     ------------------------------------------------------------------ */
  const STEP = 60 / 138 / 4;   // one sixteenth
  const OST_BAR = 8;               // steps per bar (2/4)
  const MELODY_IN = 6 * OST_BAR;   // melody joins after 6 bars (~5.2s)
  const STABS_IN = 16 * OST_BAR;   // stabs land where the melody used to (~13.9s)

  // pulsing low arpeggio — the engine room
  const OST_BASS = ['D2', 'D3', 'A2', 'D3', 'F2', 'D3', 'A2', 'C3'];
  // sparse high tick that outlines the chord
  const OST_TOP  = [null, 'A4', null, 'D5', null, 'A4', null, 'F4'];

  // 8 bars, then loops. [step, note, lengthInSteps]
  const MELODY = [
    [0,'A4',4],[4,'D5',4],
    [8,'F5',2],[10,'E5',2],[12,'D5',4],
    [16,'C5',4],[20,'E5',4],
    [24,'D5',6],
    [32,'A4',4],[36,'D5',4],
    [40,'F5',2],[42,'G5',2],[44,'A5',4],
    [48,'G5',4],[52,'F5',4],
    [56,'E5',5],[61,'D5',3],
  ];
  const MELODY_LEN = 64;

  /**
   * Chord stabs — the third layer. Short, hard triads placed off the beat so
   * they punch against the ostinato instead of doubling it. Four bars of
   * i - VI - III - v in D minor (Dm, Bb, C, Am), two hits per bar.
   * Note that Bb is spelled A# here, because that's how the N table names it.
   */
  const STABS = [
    [2,  ['D4',  'F4', 'A4']],
    [6,  ['D4',  'F4', 'A4']],
    [10, ['A#3', 'D4', 'F4']],
    [14, ['A#3', 'D4', 'F4']],
    [18, ['C4',  'E4', 'G4']],
    [22, ['C4',  'E4', 'G4']],
    [26, ['A3',  'C4', 'E4']],
    [29, ['A3',  'C4', 'E4']],
  ];
  const STABS_LEN = 32;

  let step = 0, nextStepTime = 0;

  function scheduleStep(i, t) {
    const withMelody = i >= MELODY_IN;
    const withStabs = i >= STABS_IN;
    // Ostinato steps back once for the tune and again for the stabs, so the top
    // end never turns into mush no matter how long the wait runs.
    const duck = withStabs ? 0.42 : withMelody ? 0.55 : 1;
    const s = i % OST_BAR;

    voiceAt(N[OST_BASS[s]], t, STEP * 1.7, { type: 'triangle', vol: 0.30 * duck });
    if (OST_TOP[s]) voiceAt(N[OST_TOP[s]], t, STEP * 0.7, { type: 'square', vol: 0.075 * duck });
    if (s === 0) noiseAt(t, 0.05, { vol: 0.10 * duck, hp: 900 });
    if (s === 4) noiseAt(t, 0.03, { vol: 0.07 * duck, hp: 5000 });

    if (withMelody) {
      const m = (i - MELODY_IN) % MELODY_LEN;
      // one bar of silence at the seam so the loop breathes
      const note = MELODY.find(([at]) => at === m);
      if (note) voiceAt(N[note[1]], t, STEP * note[2] * 0.94, {
        type: 'square', vol: 0.30, vibrato: note[2] >= 4 ? 4 : 0,
      });
    }

    if (withStabs) {
      const k = (i - STABS_IN) % STABS_LEN;
      const stab = STABS.find(([at]) => at === k);
      // Three voices at once, so each stays quiet — together they read as one
      // chord rather than three competing leads.
      if (stab) stab[1].forEach(n => voiceAt(N[n], t, STEP * 1.15, { type: 'square', vol: 0.085 }));
    }
  }

  function startLoading() {
    boot(); stopLoading();
    step = 0;
    nextStepTime = ctx.currentTime + 0.06;
    const pump = () => {
      // schedule everything due in the next 200ms, then hand back control
      while (nextStepTime < ctx.currentTime + 0.2) {
        scheduleStep(step++, nextStepTime);
        nextStepTime += STEP;
      }
    };
    pump();
    loadingTimer = setInterval(pump, 40);
  }
  function stopLoading() { clearInterval(loadingTimer); loadingTimer = null; }

  /* ------------------------------------------------------------------
     WIN — a fanfare in D major, ~6s. Three voices: a lead that climbs twice
     and lands on a held top A, a quiet harmony filling out the long notes so
     they read as brass rather than as one thin square, and a walking bass
     under D - A - Bm - G - A - D. Deliberately the same key as the title
     theme, so winning sounds like it belongs to the same game.
     [note, eighth, lengthInEighths]
     ------------------------------------------------------------------ */
  const F8 = 0.155;                       // one eighth
  const FANFARE_LEAD = [
    ['D5',  0, 1], ['F#5', 1, 1], ['A5',  2, 1], ['D6',  3, 3],
    ['C#6', 6, 1], ['D6',  7, 1], ['E6',  8, 1], ['F#6', 9, 3],
    ['E6', 12, 1], ['F#6',13, 1], ['G6', 14, 1], ['A6', 15, 4],
    ['G6', 19, 1], ['F#6',20, 1], ['E6', 21, 1], ['D6', 22, 2],
    ['A5', 24, 1], ['B5', 25, 1], ['C#6',26, 1], ['D6', 27, 2],
    ['F#6',29, 1], ['A6', 30, 8],
  ];
  // Only under the held notes — filling the quick runs too would turn to mush.
  const FANFARE_HARM = [
    ['A5',  3, 3], ['D6',  9, 3], ['F#6',15, 4], ['A5', 22, 2],
    ['D6', 30, 8], ['F#6',30, 8],
  ];
  const FANFARE_BASS = [
    ['D3',  0, 3], ['A2',  3, 3], ['D3',  6, 3], ['A2',  9, 3],
    ['B2', 12, 3], ['G2', 15, 4], ['A2', 19, 3], ['D3', 22, 2],
    ['A2', 24, 3], ['D3', 27, 3], ['D3', 30, 8],
  ];

  function fanfare() {
    boot();
    FANFARE_LEAD.forEach(([n, b, l]) => voice(N[n], b * F8, l * F8 * 0.94, { type: 'square', vol: 0.30, vibrato: l >= 3 ? 5 : 0 }));
    FANFARE_HARM.forEach(([n, b, l]) => voice(N[n], b * F8, l * F8 * 0.94, { type: 'square', vol: 0.10 }));
    FANFARE_BASS.forEach(([n, b, l]) => voice(N[n], b * F8, l * F8 * 0.92, { type: 'triangle', vol: 0.40 }));
    for (const b of [0, 6, 12, 18, 24, 30]) noise(b * F8, 0.06, { vol: 0.26, hp: 400 });
    for (let b = 1; b < 30; b += 2) noise(b * F8, 0.025, { vol: 0.075, hp: 5000 });
    noise(30 * F8, 0.45, { vol: 0.24, hp: 900 });     // crash on the last chord
  }

  /* ------------------------------------------------------------------
     LOSE — a pipe lament in D minor, ~8s. Bagpipes are a drone plus a reedy
     melody, so that is what this is: D2 and A2 held underneath for the whole
     piece (the fixed envelope's long tail does the dying-away for free), and
     a heavily vibratoed melody over the top with a grace note flicked in
     ahead of each long one, which is the ornament that makes a pipe sound
     like a pipe rather than a flute.
     [note, quarter, lengthInQuarters]
     ------------------------------------------------------------------ */
  const L4 = 0.30;                        // one quarter — slow
  const LAMENT_MELODY = [
    ['A4',  0, 3],
    ['C5',  3, 1],
    ['D5',  4, 4],
    ['C5',  8, 1],
    ['A4',  9, 3],
    ['F4', 12, 2],
    ['G4', 14, 1],
    ['A4', 15, 3],
    ['F4', 18, 1],
    ['E4', 19, 1],
    ['D4', 20, 6],
  ];
  // A step above the note it leads into, flicked in just before the beat.
  const LAMENT_GRACE = [['B4', 4], ['E5', 9], ['B4', 15], ['E4', 20]];
  const LAMENT_LEN = 26;

  function lament() {
    boot();
    const total = LAMENT_LEN * L4;
    voice(N['D2'], 0, total, { type: 'triangle', vol: 0.28 });
    voice(N['A2'], 0, total, { type: 'triangle', vol: 0.19 });
    LAMENT_MELODY.forEach(([n, b, l]) => voice(N[n], b * L4, l * L4 * 0.96, {
      type: 'square', vol: 0.33, vibrato: l >= 3 ? 7 : 3,
    }));
    LAMENT_GRACE.forEach(([n, b]) => voice(N[n], b * L4 - 0.055, 0.05, { type: 'square', vol: 0.22 }));
  }

  /* ------------------------------------------------------------------
     INTRO — the bed under the two opening stills. D minor at 76bpm, four
     bars that loop: i - i - VI - v, or D - D - Bb - A. The bass is a rocking
     pulse rather than held notes — root on the beat, fifth on the upbeat —
     because the voice envelope up in voiceAt() is built for short chiptune
     notes and hard-decays to nothing over a long one. A held D2 reads as a
     thump and then four seconds of silence; a pulse holds the floor. Over it
     a thin descending phrase, and a soft double thump on beats one and three
     because the punk is sitting still and the music should be too.

     introLift() fires when the second still arrives — "I've gotta get out of
     here" — and puts a rising D minor arpeggio and a hit on top of the same
     loop, so the mood turns without the music having to stop.

     Levels are the point here. This plays under a speechSynthesis voiceover
     on a phone speaker, so the bed is deliberately mixed at around -22 dBFS:
     an earlier version sat 10dB lower and was inaudible in the room, which is
     the same mistake the first shot-clock pips made.
     ------------------------------------------------------------------ */
  const I4 = 60 / 76;                  // one quarter, ~0.79s
  const INTRO_LEN = 16;                // quarters in the loop (4 bars of 4)
  // one [root, fifth] per bar
  const INTRO_CHORDS = [['D2','A2'], ['D2','A2'], ['A#2','F3'], ['A2','E3']];
  const INTRO_TOP = [['D5',2,2], ['C5',6,1], ['A4',7,2], ['F4',10,2], ['E4',14,2]];
  let introTimer = null;

  function introOnce(offset = 0) {
    for (let q = 0; q < INTRO_LEN; q++) {
      const [root, fifth] = INTRO_CHORDS[Math.floor(q / 4)];
      voice(N[root],  offset + q * I4,           I4 * 0.55, { type: 'triangle', vol: 0.74 });
      voice(N[fifth], offset + (q + 0.5) * I4,   I4 * 0.40, { type: 'triangle', vol: 0.36 });
      if (q % 4 === 0) noise(offset + q * I4, 0.09, { vol: 0.16, hp: 200 });
      if (q % 4 === 2) noise(offset + q * I4, 0.05, { vol: 0.07, hp: 2600 });
    }
    INTRO_TOP.forEach(([n, b, l]) => voice(N[n], offset + b * I4, l * I4 * 0.8, {
      type: 'square', vol: 0.41, vibrato: l >= 2 ? 3 : 0,
    }));
  }
  function startIntro() {
    boot(); stopIntro();
    introOnce(0.05);
    introTimer = setInterval(() => introOnce(0.02), INTRO_LEN * I4 * 1000);
  }
  function stopIntro() { clearInterval(introTimer); introTimer = null; }

  function introLift() {
    boot();
    ['D4', 'F4', 'A4', 'D5', 'F5'].forEach((n, i) => voice(N[n], i * 0.085, 0.22, { type: 'square', vol: 0.34 }));
    voice(N['A5'], 0.425, 0.9, { type: 'square', vol: 0.32, vibrato: 5 });
    voice(N['D3'], 0, 0.9, { type: 'triangle', vol: 0.46 });
    noise(0, 0.13, { vol: 0.22, hp: 500 });
  }

  /* ---- one-shots ---- */
  const sfx = {
    blip:    () => voice(N['D5'], 0, 0.035, { type: 'square', vol: 0.09 }),
    hover:   () => voice(N['A4'], 0, 0.04,  { type: 'square', vol: 0.08 }),
    // Shot-clock pips, one a second. These have to carry over a phone speaker in
    // a room you are moving around, so they are an order of magnitude louder and
    // longer than the UI accents above — an earlier 28ms/0.075 version was
    // inaudible in practice.
    pip:     () => voice(N['A4'], 0, 0.07, { type: 'square', vol: 0.24 }),
    // The last few seconds double up: two pips a second, a fifth higher and
    // louder again, so the acceleration is what tells you you're out of road.
    pipHot:  () => {
      voice(N['E5'], 0,    0.075, { type: 'square', vol: 0.36 });
      voice(N['E5'], 0.42, 0.075, { type: 'square', vol: 0.36 });
    },
    // Lost a go. Deliberately not the game-over sting: a short two-tone klaxon,
    // so "that attempt is gone" and "the run is over" don't sound the same.
    buzz:    () => {
      voice(N['A#3'], 0,    0.17, { type: 'square', vol: 0.36 });
      voice(N['F3'],  0.15, 0.30, { type: 'square', vol: 0.36, slide: 0.8 });
      noise(0, 0.10, { vol: 0.18, hp: 300 });
    },
    select:  () => { voice(N['D5'], 0, 0.06, { vol: 0.3 }); voice(N['A5'], 0.06, 0.12, { vol: 0.3 }); },
    confirm: () => { ['D5','F#5','A5','D6'].forEach((n, i) => voice(N[n], i * 0.055, 0.14, { vol: 0.32 })); },
    thud:    () => { voice(N['D3'], 0, 0.22, { type: 'triangle', vol: 0.4, slide: 0.5 }); noise(0, 0.14, { vol: 0.22, hp: 400 }); },
    // The endings get whole pieces rather than stings — see above.
    win:     fanfare,
    lose:    lament,
  };

  return {
    boot, startTheme, stopTheme, startLoading, stopLoading, startIntro, stopIntro, introLift, hush, sfx,
    get loadBars() { return Math.floor(step / OST_BAR); },
    toggle() { muted = !muted; if (muted) { stopLoading(); stopTheme(); stopIntro(); hush(); if (master) master.gain.value = 0; } else if (master) master.gain.value = 0.30; return muted; },
    get muted() { return muted; },
  };
})();

/* =========================================================================
   VOICE — the prison PA system, via the browser's own speech synthesiser.
   No audio files and no API calls: every platform ships voices, they just
   disagree about what they're called and load them on their own schedule.
   ========================================================================= */
const Speech = (() => {
  let voice = null;
  let voicePoll = null;
  let primed = false;
  let clip = null;   // the <audio> element for a server-voiced or pre-baked line, if one is playing
  let unlockedAudio = null;   // the one <audio> element proven playable inside a real tap — see unlockAudio()
  // One silent 8-bit PCM frame, valid and decodable rather than an empty src,
  // because an <audio> that has never actually played anything doesn't count
  // as "unlocked" on iOS/WKWebView.
  const SILENT_WAV = 'data:audio/wav;base64,UklGRiUAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQEAAACA';
  /**
   * 'unknown' until we have watched one utterance actually try to start.
   *
   * Android System WebView is the reason this exists. It exposes
   * window.speechSynthesis and accepts speak() without complaint, but there is
   * no TTS engine wired up behind it: nothing is spoken, no error fires, and
   * getVoices() stays empty for ever. There is no capability flag that tells
   * you this, so the only honest test is to try once and watch what happens —
   * and when nothing does, hand the line to the app, which does have a voice.
   */
  let state = 'unknown';   // 'unknown' | 'working' | 'dead'

  /**
   * A `voiceClip` is either a URL string (a pre-baked line served from
   * assets/voice/) or `{mime, data}` (base64 audio the server just synthesized
   * for a live judge/timeout reason). Either way it's real recorded audio, not
   * a browser TTS voice, so it plays the same everywhere `<audio>` works —
   * including the Android WebView that speechSynthesis is dead on.
   */
  function clipSrc(voiceClip) {
    if (!voiceClip) return null;
    if (typeof voiceClip === 'string') return voiceClip;
    if (voiceClip.data) return `data:${voiceClip.mime || 'audio/wav'};base64,${voiceClip.data}`;
    return null;
  }

  function pick() {
    if (!window.speechSynthesis) return null;
    const all = speechSynthesis.getVoices() || [];
    if (!all.length) return null;                 // often empty on first call
    // Always English, whatever the interface language is set to: the punk's
    // lines are deliberately English and an English voice is what reads them.
    const en = all.filter(v => /^en\b|^en[-_]/i.test(v.lang || ''));
    const pool = en.length ? en : all;
    // Names are the only reliable gender signal, and they vary by platform:
    // Daniel/Alex/Fred on Apple, David/Guy/Ryan on Windows, "... Male" on Chrome.
    const male = /\bmale\b|daniel|alex|fred|arthur|george|david|guy|ryan|rishi|oliver/i;
    return pool.find(v => male.test(v.name) && !/female/i.test(v.name)) || pool[0];
  }

  function init() {
    try {
      if (!window.speechSynthesis) { state = 'dead'; return; }
      voice = pick();
      if (voice) return;
      // Chrome populates the list asynchronously and says so. Other engines
      // populate it late and never fire the event, so poll for a few seconds
      // as well rather than trusting one listener to arrive.
      speechSynthesis.addEventListener('voiceschanged', () => { voice = voice || pick(); }, { once: true });
      let tries = 0;
      clearInterval(voicePoll);
      voicePoll = setInterval(() => {
        voice = voice || pick();
        if (voice || ++tries > 20) clearInterval(voicePoll);
      }, 250);
    } catch { state = 'dead'; }
  }

  /**
   * iOS/WKWebView will only let an <audio> element play() when the call is
   * still inside a real tap's call stack — and every line in this game is
   * spoken from an async callback (the ask after startRun()/openCamera()
   * resolves, the reason after judge/timeout comes back), which is always
   * well outside that window. The standard mitigation, used by every game
   * that plays sound on iOS Safari: play a real, silent, decodable clip once
   * from inside a genuine gesture, and reuse that SAME element for every
   * later programmatic play() — a brand-new Audio() built later doesn't
   * inherit the unlock on some WebKit builds, but a previously-played
   * element does. An empty/no-src <audio> does not count as "played", which
   * is why this is a one-frame WAV rather than nothing.
   */
  function unlockAudio() {
    if (unlockedAudio) return;
    try {
      const a = new Audio(SILENT_WAV);
      a.volume = 0;
      const p = a.play();
      if (p && p.catch) p.catch(() => { /* still counts as the attempt; nothing lost */ });
      unlockedAudio = a;
    } catch { /* nothing lost by trying */ }
  }

  /**
   * Some engines will only ever speak if the very first utterance was started
   * from inside a real user gesture. Run on the first tap anywhere: it costs one
   * silent utterance (plus one silent audio clip, for real recorded lines) and
   * makes every later line work.
   */
  function prime() {
    if (primed) return;
    primed = true;
    unlockAudio();
    if (!window.speechSynthesis) return;
    try {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      speechSynthesis.speak(u);
    } catch { /* nothing lost by trying */ }
  }

  /** No engine behind the API. Stop pretending, and ask the app instead. */
  function giveUp(text) {
    if (state === 'dead') return;
    state = 'dead';
    console.warn('[speech] nothing behind speechSynthesis — handing lines to the app');
    Analytics.capture('speech_unavailable', { in_webview: Bridge.inApp });
    // Outside the app there is nobody else to ask, so stop advertising a
    // tap-to-hear affordance that cannot do anything.
    if (!Bridge.inApp) document.body.classList.add('no-speech');
    Bridge.speak(text);
  }

  return {
    init, prime,
    get state() { return state; },
    /**
     * Browser TTS, exactly as before — the fallback for whenever a real
     * recorded clip isn't available (no key, generation failed, or this line
     * has no pre-baked file). Split out of say() so a clip's own onerror can
     * drop back to it without duplicating the logic.
     */
    sayBrowser(text) {
      if (!window.speechSynthesis || state === 'dead') return void Bridge.speak(text);
      if (!voice) voice = pick();

      const fire = () => {
        const u = new SpeechSynthesisUtterance(String(text));
        u.lang = 'en-GB';
        if (voice) {
          try { u.voice = voice; if (/^en/i.test(voice.lang || '')) u.lang = voice.lang; }
          catch { /* engine refused the voice; the default one still speaks */ }
        }
        u.pitch = 0.6;              // dropped well below natural — reads as machine
        u.rate = 0.95;
        let started = false;
        u.onstart = () => { started = true; state = 'working'; };
        u.onerror = () => { if (!started) giveUp(text); };
        // If nothing has begun in a second and a half, nothing is going to.
        setTimeout(() => { if (!started && state !== 'working') giveUp(text); }, 1500);
        speechSynthesis.speak(u);
      };

      // cancel() followed immediately by speak() silently drops the new
      // utterance on several Android builds, which is a very good way to end
      // up with a game that never says anything. Only cancel when something
      // is actually in the air, and give the queue a beat to clear.
      if (speechSynthesis.speaking || speechSynthesis.pending) {
        speechSynthesis.cancel();
        setTimeout(fire, 120);
      } else {
        fire();
      }
    },
    /**
     * Never allowed to throw. say() is called synchronously from the middle of
     * a stage, so an unhappy speech engine — a rejected voice object, a platform
     * quirk, a policy block — must cost the flavour and nothing else. Losing an
     * attempt because the narrator cleared its throat would be absurd.
     *
     * `voiceClip` (optional) is a real recorded line — a pre-baked URL or the
     * live audio a judge/timeout response just carried back — and always wins
     * over browser TTS when present. Passing nothing keeps the old behaviour.
     */
    say(text, voiceClip) {
      try {
        if (Chip.muted || !text) return;
        const src = clipSrc(voiceClip);
        if (src) {
          // Reuse the element unlockAudio() already got a real play() out of,
          // rather than a fresh Audio() — see unlockAudio() for why. Falls
          // back to a plain new one if prime() never ran (shouldn't happen;
          // the game wires it to the very first click anywhere).
          if (clip && clip !== unlockedAudio) { try { clip.pause(); } catch { /* already gone */ } }
          clip = unlockedAudio || new Audio();
          clip.onerror = () => { console.warn('[speech] clip errored, falling back:', clip.error && clip.error.message); this.sayBrowser(text); };
          clip.src = src;
          clip.currentTime = 0;
          const p = clip.play();
          if (p && p.catch) p.catch(e => {
            console.warn('[speech] clip.play() blocked, falling back:', e && e.message);
            Analytics.capture('voice_clip_blocked', { in_webview: Bridge.inApp, reason: (e && e.name) || 'unknown' });
            this.sayBrowser(text);
          });
          return;
        }
        this.sayBrowser(text);
      } catch (e) {
        console.warn('speech unavailable:', e && e.message);
      }
    },
    stop() {
      try { if (clip) clip.pause(); } catch { /* nothing to stop */ }
      try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch { /* nothing to stop */ }
    },
  };
})();

/* =========================================================================
   LANGUAGE — interface chrome only. The punk's asks and the judge's one-line
   reactions arrive in English on purpose: an English voice reads them aloud.
   ========================================================================= */
const Lang = (() => {
  // Just enough English to stay playable if /i18n.js is blocked or missing.
  const BARE = {
    lang_prompt: 'WANT HINTS IN YOUR LANGUAGE?',
    gate_title: 'RESTRICTED AREA', gate_hint: 'ACCESS CODE', gate_go: 'UNLOCK',
    cam_title: 'CAMERA CHECK',
    cam_why: 'This game is played with the camera on the back of your phone.',
    cam_privacy: 'Photos are looked at once, then thrown away.',
    cam_allow: 'TURN ON THE CAMERA', cam_denied: 'No camera, no problem.',
    cam_pick: 'CHOOSE A PHOTO', cam_retry: 'TRY THE CAMERA AGAIN',
    cam_native: 'This phone opens the camera full screen — snap it there and you’re straight back.',
    translate: 'SHOW MY LANGUAGE',
    hud_stage: 'STAGE {n}/{total}', brief_go: 'OPEN CAMERA', cam_shoot: 'SHOOT IT',
    cam_switch: 'PICK A PHOTO INSTEAD', cam_hint: 'HOLD IT UP AND FILL THE FRAME',
    judging: 'DEVELOPING', judging_notes: ['HE’S HAVING A LOOK...'],
    verdict_pass: 'THAT’LL DO', verdict_fail: 'NOT A CHANCE',
    verdict_unreadable: 'CAN’T SEE IT', verdict_error: 'HOLD ON',
    verdict_timeout: 'OUT OF TIME',
    free_retry: 'FREE GO — THAT ONE DIDN’T COUNT', attempts_left: '{n} LEFT',
    last_chance: 'LAST CHANCE', retry: 'GO AGAIN', onward: 'GO ON THEN',
    caught_title: 'CAUGHT', caught_sub: 'Three strikes and the guard was already behind you.',
    caught_far: 'YOU GOT TO {scene}', escaped_title: 'OUT!',
    escaped_sub: 'Seven rooms, seven things you found lying around.', restart: 'GO AGAIN',
    finish: 'FINISH', finish_wait: 'Finishing up — tap again if nothing happens.',
    evidence_title: 'THE EVIDENCE', evidence_tap: 'WHAT YOU ACTUALLY HANDED HIM',
    err_system: 'SYSTEM ERROR', err_camera: 'CAMERA UNAVAILABLE',
    err_try: 'TRY AGAIN', err_new: 'START A NEW RUN',
  };
  let code = 'en';
  const all = () => (window.I18N && window.I18N.strings) || { en: BARE };
  const dict = () => all()[code] || all().en || BARE;

  return {
    get code() { return code; },
    /** How this language calls itself — 'ESPAÑOL'. */
    get label() {
      const hit = this.list().find(l => l.code === code);
      return (hit && hit.label) || code.toUpperCase();
    },
    get locale() {
      const hit = this.list().find(l => l.code === code);
      return (hit && hit.locale) || code || 'en';
    },
    list() {
      return (window.I18N && window.I18N.langs) || [{ code: 'en', label: 'ENGLISH', locale: 'en-GB' }];
    },
    set(next) {
      code = this.list().some(l => l.code === next) ? next : 'en';
      document.body.dataset.lang = code;
      document.documentElement.lang = code;
    },
    notes() { return dict().judging_notes || BARE.judging_notes; },
    t(key, vars) {
      let out = dict()[key];
      if (out === undefined) out = (all().en || BARE)[key];
      if (out === undefined) out = BARE[key] !== undefined ? BARE[key] : key;
      out = String(out);
      if (vars) for (const k in vars) out = out.split('{' + k + '}').join(vars[k]);
      return out;
    },
    /** Locale-aware casing. Turkish 'i' uppercases to 'İ', not 'I'. */
    up(s) {
      try { return String(s).toLocaleUpperCase(this.locale); }
      catch { return String(s).toUpperCase(); }
    },
  };
})();

/* =========================================================================
   ANALYTICS — additive EscapeJailCamera.* events only.
   This app has its own prefix and its own $app_name, so nothing it sends
   touches, renames or redefines any event belonging to another product.
   Inert unless the server hands over a key, and never allowed to throw:
   losing an attempt to a blocked analytics script would be absurd.
   ========================================================================= */
const Analytics = (() => {
  const APP = 'EscapeJailCamera';
  let ready = false;

  function load(host) {
    return new Promise(resolve => {
      const el = document.createElement('script');
      el.src = String(host).replace(/\/+$/, '') + '/static/array.js';
      el.async = true;
      el.onload = () => resolve(true);
      el.onerror = () => resolve(false);   // ad-blocked: carry on silently
      document.head.appendChild(el);
    });
  }

  return {
    async init(cfg) {
      try {
        if (!cfg || !cfg.key) return;                    // no key = no tracking
        if (!(await load(cfg.host))) return;
        if (!window.posthog || !window.posthog.init) return;
        window.posthog.init(cfg.key, {
          api_host: cfg.host,
          autocapture: false,        // a handful of screens; the custom events are the signal
          capture_pageview: false,
          capture_pageleave: true,
          persistence: 'localStorage+cookie',
        });
        // $app_name is autocaptured by the mobile SDKs but not on web. Setting it
        // is what keeps this prototype's traffic separable from every other app.
        window.posthog.register({ $app_name: APP });
        ready = true;
      } catch (e) { console.warn('analytics off:', e && e.message); }
    },
    capture(name, props, opts) {
      try {
        if (!ready || !window.posthog) return;
        window.posthog.capture(APP + '.' + name,
          Object.assign({ language_code: Lang.code }, props || {}), opts);
      } catch { /* never costs an attempt */ }
    },
    // $screen is PostHog's own pre-existing screen-view event (the one the
    // mobile SDKs send automatically on every screen change) rather than a
    // one-off custom event — kept as its literal name, unprefixed, so it
    // rolls up the same way a native screen view would. $app_name (set at
    // init, above) is what still keeps this app's screens separable.
    screen(name) {
      try {
        if (!ready || !window.posthog) return;
        window.posthog.capture('$screen', { $screen_name: name, language_code: Lang.code });
      } catch { /* never costs an attempt */ }
    },
    register(props) { try { if (ready && window.posthog) window.posthog.register(props || {}); } catch {} },
    unregister(key) { try { if (ready && window.posthog) window.posthog.unregister(key); } catch {} },
  };
})();

/* =========================================================================
   SCREENS + TEXT
   ========================================================================= */
const $ = id => document.getElementById(id);

// Slug shown in the DOM/URL → the descriptive name that goes out on the
// $screen event. "end" isn't here: it's win or lose, decided below from the
// outcome the caller already stamped onto the body.
const SCREEN_NAMES = {
  gate: 'Access Gate',
  title: 'Title',
  primer: 'Camera Permission Primer',
  intro: 'Intro',
  brief: 'Stage Brief',
  cam: 'Camera',
  judge: 'Judging',
  verdict: 'Verdict',
  error: 'Error',
};

function show(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 'screen-' + name));
  // Which gradient the page wears is a function of which screen is up — see the
  // body[data-screen] rules. All of them are charcoal; the hue is the hint.
  document.body.dataset.screen = name;
  window.scrollTo(0, 0);
  const screenName = name === 'end'
    ? (document.body.dataset.outcome === 'win' ? 'Escaped' : 'Caught')
    : (SCREEN_NAMES[name] || name);
  Analytics.screen(screenName);
}

/** Fills every [data-t] from the current language. Called again on a switch. */
function applyText(root) {
  (root || document).querySelectorAll('[data-t]').forEach(el => {
    el.textContent = Lang.t(el.dataset.t);
  });
}

function buildLangs() {
  const host = $('langs');
  host.innerHTML = '';
  Lang.list().forEach(l => {
    const b = document.createElement('button');
    b.className = 'lang-chip' + (l.code === Lang.code ? ' on' : '');
    b.textContent = l.label;
    // There's no separate start button any more: picking a hint language IS
    // starting the run. titleArmed guards against a tap landing before
    // /api/health has told us whether this session is gated.
    b.addEventListener('click', () => {
      if (!titleArmed) return;
      titleArmed = false;   // one shot — ignore a second tap while we leave
      Chip.sfx.blip();
      Lang.set(l.code);
      applyText(document);
      startRun();
    });
    host.appendChild(b);
  });
}

/**
 * A line the punk says out loud, with a tap-to-hear affordance.
 *
 * `vocab` bolds the words this stage teaches and makes each one tappable. The
 * pristine English is stashed on the element, because once a gloss or a
 * translation is showing, textContent is no longer the English — and the voice
 * must stay English whatever the screen says. That is the whole point: read it
 * in your language if you need to, hear it in English regardless.
 */
function speakable(text, vocab, voiceUrl) {
  const wrap = document.createElement('div');
  wrap.dataset.say = '';
  wrap.dataset.speak = text;
  if (voiceUrl) wrap.dataset.speakVoice = voiceUrl;
  const line = document.createElement('span');
  line.className = 'line';
  line.append(...markVocab(text, vocab));
  const icon = document.createElement('span');
  icon.className = 'say';
  icon.textContent = '🔊';
  icon.title = Lang.t('say_hint');
  wrap.append(line, icon);
  return wrap;
}

/**
 * Split a line into text and <b class="key"> nodes for the target words. Longest
 * match first, so "light the way" wins over a bare "light" if both were listed,
 * and every match is verbatim — stages.js guarantees the word appears in the ask.
 */
function markVocab(text, vocab) {
  const words = (vocab || []).filter(v => v && v.word && text.includes(v.word));
  if (!words.length) return [document.createTextNode(text)];
  const order = [...words].sort((a, b) => b.word.length - a.word.length);
  let parts = [text];
  for (const v of order) {
    const next = [];
    for (const part of parts) {
      if (typeof part !== 'string') { next.push(part); continue; }
      const bits = part.split(v.word);
      bits.forEach((bit, i) => {
        if (bit) next.push(bit);
        if (i < bits.length - 1) next.push(v);
      });
    }
    parts = next;
  }
  return parts.map(part => {
    if (typeof part === 'string') return document.createTextNode(part);
    const b = document.createElement('b');
    b.className = 'key';
    b.textContent = part.word;
    b.dataset.word = part.word;
    if (part.local) {
      b.dataset.local = part.local;
      b.title = part.local;
    }
    return b;
  });
}

document.addEventListener('click', e => {
  // A tapped keyword is a gloss request, not a read-aloud request.
  const key = e.target.closest('.key');
  if (key) {
    e.stopPropagation();
    return Assist.toggleWord(key);
  }
  const host = e.target.closest('[data-say]');
  if (!host) return;
  const line = host.querySelector('.line');
  Speech.say(host.dataset.speak || (line || host).textContent, host.dataset.speakVoice);
});

// The first tap anywhere, whatever it was for. Several speech engines will only
// ever speak if the first utterance was started inside a real user gesture, and
// by the time the punk has something to say we are no longer in one.
document.addEventListener('click', () => Speech.prime(), { once: true, capture: true });

/* =========================================================================
   CAMERA

   Two capture paths, and the game is completable on either. getUserMedia gives
   the live viewfinder, which is the good version. The file input is the
   fallback when it is unavailable or refused — on a phone, capture="environment"
   still opens the rear camera, so mobile players lose the viewfinder and
   nothing else. Desktop players get a file picker.

   Everything here needs https. On http the browser will simply refuse, which
   is why the dev loop for this game runs through the deployed URL or a tunnel.
   ========================================================================= */
const Camera = (() => {
  let stream = null;
  let mode = 'live';           // 'live' | 'file'
  // Sticky for the page's lifetime. The stream is stopped between runs so the
  // recording indicator goes out, but the permission itself doesn't come back —
  // so a replay should never make the player agree to the camera twice.
  let granted = false;
  /**
   * Set once we have seen this device refuse to show the feed inside the page.
   *
   * iOS WKWebView does exactly that unless the host app passes
   * allowsInlineMediaPlayback: the <video> will not start inline however much
   * playsinline the page sets, iOS paints its own play button over it, and
   * tapping that throws the feed into the native fullscreen player — so the
   * player has to swipe back out to reach the shutter, with the shot clock
   * running the whole time. That is the NJA-2872 iOS report, and the same page
   * in mobile Safari on the same phone is fine, because Safari allows inline.
   *
   * The real fix is one prop on the app's WebView. Until then, once we have
   * seen it we stop asking for a feed and use the native capture sheet, which
   * works everywhere and needs nothing from the app.
   */
  let inlineBlocked = false;

  /**
   * webkitbeginfullscreen only fires on iOS, and only when iOS has taken the
   * video fullscreen — which is proof of exactly the condition above, so it is
   * both a detector and a last line of defence if the check below is passed.
   */
  function watchFullscreen(video) {
    if (!video || video.dataset.fsWatched) return;
    video.dataset.fsWatched = '1';
    video.addEventListener('webkitbeginfullscreen', () => {
      inlineBlocked = true;
      try { if (video.webkitExitFullscreen) video.webkitExitFullscreen(); } catch { /* let it be */ }
      onInlineBlocked();
    });
    // If it does go fullscreen anyway, at least stop charging the player for
    // the time they spend in there — visibilitychange does not fire for this.
    video.addEventListener('webkitendfullscreen', () => { Clock.resume(); });
  }

  /**
   * Wait for real decoded frames. A stream we hold but cannot display is worse
   * than no stream at all, because the game looks broken rather than limited.
   * Generous, because a cold camera on a slow phone can take a second or two.
   */
  function hasFeed(video, ms) {
    return new Promise(resolve => {
      const t0 = Date.now();
      (function look() {
        if (video.videoWidth > 0 && video.readyState >= 2 && !video.paused) return resolve(true);
        if (Date.now() - t0 > ms) return resolve(false);
        setTimeout(look, 100);
      })();
    });
  }

  /** @returns {Promise<'live'|'nofeed'|'denied'>} */
  async function attach() {
    if (mode === 'file' || inlineBlocked) return 'nofeed';
    const video = $('video');
    watchFullscreen(video);
    if (stream && stream.active && video.srcObject === stream && video.videoWidth > 0 && !video.paused) return 'live';
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no getUserMedia');
      stream = await navigator.mediaDevices.getUserMedia({
        // A phone has a rear camera and that is the one that can see the room.
        // On a laptop this constraint is simply ignored and the webcam is used.
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 1280 } },
        audio: false,
      });
      video.srcObject = stream;
      granted = true;
      // Some browsers need the play() even with autoplay set. A rejection here
      // is the signature of a webview that will not play inline, so it shortens
      // how long we are willing to wait before giving up on the feed.
      let refused = false;
      try { await video.play(); } catch (e) { refused = true; }
      if (!(await hasFeed(video, refused ? 600 : 3000))) {
        console.warn('camera stream will not play inline on this device — using native capture');
        inlineBlocked = true;
        stop();
        return 'nofeed';
      }
      return 'live';
    } catch (e) {
      console.warn('camera unavailable:', e && e.message);
      Analytics.capture('camera_denied', { reason: (e && e.name) || 'unknown' });
      stream = null;
      return 'denied';
    }
  }

  function stop() {
    try { if (stream) stream.getTracks().forEach(t => t.stop()); } catch { /* already gone */ }
    stream = null;
    const v = $('video');
    if (v) v.srcObject = null;
  }

  /**
   * Downscale on the way out. 768px on the longest edge is plenty for "what is
   * this object" and keeps a photo around 60–120KB, which matters on a phone
   * connection and keeps us well under the server's size cap.
   */
  function encode(source, w, h) {
    if (!w || !h) return null;
    const MAX = 768;
    const scale = Math.min(1, MAX / Math.max(w, h));
    const c = $('canvas');
    c.width = Math.round(w * scale);
    c.height = Math.round(h * scale);
    const ctx = c.getContext('2d');
    ctx.drawImage(source, 0, 0, c.width, c.height);
    return { dataURL: c.toDataURL('image/jpeg', 0.7), mime: 'image/jpeg' };
  }

  return {
    get mode() { return mode; },
    set mode(m) { mode = m; },
    get live() { return !!(stream && stream.active); },
    get granted() { return granted; },
    get inlineBlocked() { return inlineBlocked; },
    attach, stop,
    /** Grab the current viewfinder frame. */
    capture() {
      const v = $('video');
      return encode(v, v.videoWidth, v.videoHeight);
    },
    /** Same, from a chosen file. */
    fromFile(file) {
      return new Promise(resolve => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { const out = encode(img, img.naturalWidth, img.naturalHeight); URL.revokeObjectURL(url); resolve(out); };
        img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
        img.src = url;
      });
    },
  };
})();

/* =========================================================================
   THE NOVAPALS WEBVIEW BRIDGE

   This page is also opened as a quest activity inside the NovaPals app, in a
   fullscreen portrait webview (NJA-2872). The app covers it with a loading
   overlay and waits for the page to say it is ready; until that message lands
   the child is watching a spinner and nothing else, which is exactly what QA
   hit. Two messages, and only two:

     NovaPals.Prototype.Start   the game is on screen — lift the overlay
     NovaPals.Prototype.End     the run is finished — complete the quest, award
                                the gems, close the webview

   On shape: the app's handleWebViewPostMessage is the other side of a boundary
   this page cannot read, and react-native-webview delivers every message as a
   string. So each one goes twice — once as the bare event name, once as JSON
   carrying that name under type, event AND name. A handler keyed on any of
   those sees it; the others fail to parse and ignore it. If the real contract
   turns out to be something else, this is the only function to change.

   Start is idempotent — it hides an overlay — so it is repeated, because a
   missed Start strands the player on that spinner for ever. End is not: it
   completes a quest and pays out, so it is only ever sent from an explicit tap
   on FINISH, and the button locks itself for four seconds so a double-tap
   cannot pay out twice.
   ========================================================================= */
const Bridge = (() => {
  const START = 'NovaPals.Prototype.Start';
  const END = 'NovaPals.Prototype.End';
  const SPEAK = 'NovaPals.Prototype.Speak';
  let startSends = 0, endSends = 0, speakSends = 0;

  /** react-native-webview injects this into the page before our scripts run. */
  function host() {
    const rn = window.ReactNativeWebView;
    return rn && typeof rn.postMessage === 'function' ? rn : null;
  }

  function send(name) {
    const rn = host();
    const payloads = [
      name,
      JSON.stringify({ type: name, event: name, name, source: 'jailbreak-camera' }),
    ];
    for (const payload of payloads) {
      try { if (rn) rn.postMessage(payload); }
      catch (e) { console.warn('[NovaPals] bridge failed:', e && e.message); }
      // And up to a parent frame, so the same page still works if it is ever
      // embedded in an iframe instead of a native webview. Skipped entirely
      // when there is no parent, so a plain tab sends nothing at all.
      try { if (window.parent && window.parent !== window) window.parent.postMessage(payload, '*'); }
      catch { /* cross-origin parent that won't take it; nothing to do */ }
    }
    console.log('[NovaPals] ->', name, rn ? '(webview)' : '(no host — standalone browser)');
  }

  return {
    /** True when we are running inside the app rather than a plain browser. */
    get inApp() { return !!host(); },
    get startSends() { return startSends; },
    get endSends() { return endSends; },

    /**
     * The game is painted and the overlay can go. Called as early as possible —
     * before /api/health, which on a cold Render instance can take half a
     * minute — and then twice more, in case the app's listener was not attached
     * when the first one went out.
     */
    ready() {
      if (startSends) return;
      startSends++;
      send(START);
      setTimeout(() => { startSends++; send(START); }, 1200);
      setTimeout(() => { startSends++; send(START); }, 3500);
    },

    /**
     * The player finished and tapped FINISH. Only ever called from that tap:
     * backing out or closing the webview must NOT complete the quest, so there
     * is deliberately no End on pagehide.
     */
    finish() {
      endSends++;
      send(END);
      return endSends;
    },

    /**
     * "Please say this out loud." Entirely optional: an app that does not
     * implement it drops the message and nothing changes. It exists because
     * Android System WebView has no TTS engine behind speechSynthesis, so on
     * that platform the app is the only thing that can give the punk a voice.
     *
     * JSON only — there is a payload to carry, which a bare event name cannot
