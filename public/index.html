     * do — and rate-limited by the caller, which speaks one line at a time.
     */
    speak(text) {
      const rn = host();
      if (!rn || !text) return false;
      speakSends++;
      try {
        rn.postMessage(JSON.stringify({
          type: SPEAK, event: SPEAK, name: SPEAK,
          text: String(text).slice(0, 400),
          lang: 'en-GB',
          source: 'jailbreak-camera',
        }));
        return true;
      } catch (e) {
        console.warn('[NovaPals] speak failed:', e && e.message);
        return false;
      }
    },
    get speakSends() { return speakSends; },
  };
})();

/* =========================================================================
   VOCABULARY SUPPORT

   The game is in English on purpose — that is what the child is here to learn —
   but a full sentence is more than an eleven-year-old at A2 can always take, and
   a kid who cannot read the ask cannot play. So there are two levels of help,
   both free, both deliberately requiring a deliberate action:

     tap a bold word    the gloss appears beside it, English still visible
     tap the language    the whole line appears underneath, smaller and dimmer

   Three rules hold this together, and each of them exists because the obvious
   version of this feature teaches nothing:

     1. Help is per line, and resets when the stage changes. A toggle that
        persisted would be flipped once on stage one and the remaining six would
        be played in Spanish — an English game with English audio and nothing
        else. Every ask gets met in English first.
     2. The gloss goes BESIDE the English, never instead of it. Whoever does the
        work of getting meaning out of the English keeps the word; a learner
        handed a replacement reads the replacement and skips the form.
     3. The voice never changes. Audio stays English whatever the screen shows,
        so the word is always heard in the language being learned.

   And the shot clock stops while help is open, because charging a child fifteen
   seconds for not understanding yet is precisely backwards.
   ========================================================================= */
const Assist = (() => {
  let stageId = null;      // what the current state belongs to
  let open = 0;            // how many pieces of help are showing
  let sentence = false;
  let peek = null;         // auto-close timer, camera screen only

  /** Anything visible right now is about to be about a different line. */
  function reset(id) {
    if (stageId === id) return;
    stageId = id;
    closeAll();
  }

  function onCamera() {
    const el = document.querySelector('.screen.on');
    return !!(el && el.id === 'screen-cam');
  }

  /**
   * Opening help takes the clock off the player. On the camera screen it is a
   * peek rather than a mode — it closes itself after a few seconds, which is
   * long enough to read a short line and short enough that the clock cannot be
   * parked indefinitely behind an open translation.
   */
  function held() {
    if (!onCamera()) return;
    Clock.pause();
    clearTimeout(peek);
    if (open > 0) peek = setTimeout(closeAll, 6000);
    else Clock.resume();
  }

  function closeAll() {
    document.querySelectorAll('.key.open').forEach(k => showGloss(k, false));
    document.querySelectorAll('.local').forEach(el => el.remove());
    document.querySelectorAll('.assist button.on').forEach(b => b.classList.remove('on'));
    sentence = false;
    open = 0;
    clearTimeout(peek);
    Clock.resume();
  }

  function showGloss(key, on) {
    const had = key.classList.contains('open');
    if (on === had) return;
    if (on) {
      const g = document.createElement('span');
      g.className = 'gloss';
      g.textContent = ' (' + key.dataset.local + ')';
      key.appendChild(g);
      key.classList.add('open');
    } else {
      const g = key.querySelector('.gloss');
      if (g) g.remove();
      key.classList.remove('open');
    }
  }

  return {
    reset, closeAll,
    /** Tapping a bold word. Silent no-op in English, where there is no gloss. */
    toggleWord(key) {
      if (!key.dataset.local) return;
      const opening = !key.classList.contains('open');
      // Every copy of this word on screen — the brief bubble and the camera card
      // can both be showing the same line.
      document.querySelectorAll('.key[data-word="' + cssEscape(key.dataset.word) + '"]')
        .forEach(k => showGloss(k, opening));
      open += opening ? 1 : -1;
      if (open < 0) open = 0;
      Chip.sfx.blip();
      Analytics.capture(opening ? 'gloss_opened' : 'gloss_closed', {
        stage: stageId, word: key.dataset.word, on_camera: onCamera(),
      });
      held();
    },
    /** Tapping the language button: the whole line, under the English. */
    toggleSentence(hosts, text, label) {
      sentence = !sentence;
      Chip.sfx.blip();
      hosts.forEach(host => {
        if (!host) return;
        const existing = host.querySelector('.local');
        if (existing) existing.remove();
        if (sentence) {
          const el = document.createElement('span');
          el.className = 'local';
          el.textContent = text;
          host.appendChild(el);
        }
      });
      document.querySelectorAll('.assist button').forEach(b => b.classList.toggle('on', sentence));
      open += sentence ? 1 : -1;
      if (open < 0) open = 0;
      Analytics.capture(sentence ? 'translation_opened' : 'translation_closed', {
        stage: stageId, language: Lang.code, on_camera: onCamera(),
      });
      held();
    },
    get sentenceShown() { return sentence; },
    get openCount() { return open; },
  };
})();

/** CSS.escape is missing on older webviews, and a word could contain a quote. */
function cssEscape(v) {
  return window.CSS && CSS.escape ? CSS.escape(v) : String(v).replace(/["\\]/g, '\\$&');
}

/* =========================================================================
   GAME
   ========================================================================= */
let S = null;            // the server's view of the run
let health = {};
let judged = null;       // the stage the in-flight photo belongs to
let judgedAttempt = 0;   // which of its three goes this photo is
let busy = false;        // one photo in the air at a time
let noteTimer = null;
let given = null;        // ?lang=, if the app told us which one to use
let titleArmed = false;  // true once /api/health has resolved and we're not gated

async function api(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  const data = await res.json().catch(() => ({ error: 'The server said something unreadable.' }));
  if (!res.ok) throw Object.assign(new Error(data.error || `HTTP ${res.status}`), { status: res.status });
  return data;
}

let toastTimer = null;
/**
 * For the things that go wrong without ending anything: an image we couldn't
 * decode, a camera that dropped out mid-run. The error SCREEN offers a new run,
 * which would be an absurd punishment for picking the wrong file.
 */
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.remove('hide');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hide'), 4200);
  Chip.sfx.thud();
}

function fail(e, titleKey) {
  console.error(e);
  Clock.stop();
  Chip.stopLoading();
  stopNotes();
  busy = false;
  $('err-title').textContent = Lang.t(titleKey || 'err_system');
  $('err-body').textContent = (e && e.message) || String(e);
  show('error');
}

/* ---- the attempts counter, as hearts ---- */
const HEART_PATH = 'M12 21.2C11.3 21.2 3 15.9 3 10.1A5.1 5.1 0 0 1 12 6.7a5.1 5.1 0 0 1 9 3.4c0 5.8-8.3 11.1-9 11.1z';

function renderTally(host) {
  if (!host || !S) return;
  const total = S.attemptsPerStage || 3;
  const left = Math.max(0, S.attemptsLeft);
  host.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    // Spent goes go pale and flat; the one you are on beats.
    const spent = i < total - left;
    svg.setAttribute('class', 'mark' + (spent ? ' spent' : i === total - left ? ' now' : ''));
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', HEART_PATH);
    path.setAttribute('fill', 'currentColor');
    svg.appendChild(path);
    host.appendChild(svg);
  }
}

function paintHud(stagePrefix) {
  const st = S.stage;
  $(stagePrefix + '-stage').textContent = Lang.t('hud_stage', { n: S.stageNumber, total: S.totalStages });
  $(stagePrefix + '-scene').textContent = st ? Lang.up(st.scene) : '';
  renderTally($(stagePrefix + '-tally'));
}

/**
 * The title screen is live: /api/health has resolved, we're not behind a gate,
 * so a tap on a language chip is allowed to start a run. If the app already
 * told us the language (?lang=), there's nothing left to tap at all — the
 * chips are hidden, so this starts the run itself instead of waiting on one.
 */
function armTitle() {
  titleArmed = true;
  if (given) startRun();
}

/* ---- boot ---- */
async function boot() {
  // Paint and announce BEFORE anything slow or fallible. The app's overlay is up
  // until Bridge.ready() lands, and a cold Render free instance can sit on
  // /api/health for half a minute — the child should be looking at the title
  // screen with chips that aren't armed yet, not at a spinner with no end.
  // The finally is the belt: if any of this throws, the overlay still lifts.
  try {
    Speech.init();
    given = urlLang();
    Lang.set(given || 'en');
    buildLangs();
    applyText(document);

    if (Bridge.inApp) {
      // In a quest, finishing means completing the quest, not looping.
      $('end-finish').classList.remove('hide');
      $('end-again').className = 'btn ghost gap';
    }
    if (given) {
      // The app chose the language; the picker would only be a way to break
      // it, and with no button left to tap the run starts on its own once
      // armTitle() sees `given` after /api/health resolves.
      $('langs').classList.add('hide');
      document.querySelector('#screen-title .tag').classList.add('hide');
    }

    show('title');
  } finally {
    Bridge.ready();
  }

  try { health = await (await fetch('/api/health')).json(); }
  catch (e) { health = {}; }
  // Awaited so the analytics script has actually loaded and $app_name is
  // registered before anything tries to capture off the back of it — page_ready
  // and the title screen's $screen event both need `ready` to be true.
  await Analytics.init(health.posthog);
  Analytics.register({ mock_mode: !!health.mock, in_webview: Bridge.inApp });
  Analytics.capture('page_ready', { in_webview: Bridge.inApp, start_sends: Bridge.startSends });

  if (health.gated && !health.unlocked) { show('gate'); $('code').focus(); return; }
  // Title starts already visible in the HTML (class="on"), so it never goes
  // through show() the way every other screen does — fire its $screen by hand.
  Analytics.screen('Title');
  armTitle();
}

async function unlock() {
  const code = $('code').value.trim();
  $('code-err').textContent = '';
  if (!code) return;
  $('unlock').disabled = true;
  try {
    await api('/api/unlock', { code });
    Chip.boot(); Chip.sfx.confirm();
    show('title');
    armTitle();
  } catch (e) {
    $('code-err').textContent = e.message;
    Chip.sfx.thud();
  } finally {
    $('unlock').disabled = false;
  }
}

/**
 * ?lang=es — the app knows which language the child is learning in and passes it
 * on the webview URL, which is the only way this works as a quest activity. When
 * one is supplied the on-screen picker goes away: the app's choice is not the
 * child's to change halfway through a quest. Lang.set validates it and falls
 * back to English, so a nonsense value is harmless.
 */
function urlLang() {
  const l = (new URLSearchParams(location.search).get('lang') || '').slice(0, 5).toLowerCase();
  return l || null;
}

/** ?stage=4 jumps straight in, for testing stage 5 without playing four stages. */
function devStage() {
  const n = Number(new URLSearchParams(location.search).get('stage'));
  return Number.isInteger(n) && n > 0 ? n : undefined;
}

/**
 * ?verdict=fail forces every judgement, so the caught screen and the free-retry
 * path can be walked without hunting for the wrong object. Honoured by the
 * server in MOCK mode only, so it does nothing on a deployed build with a key.
 */
function devVerdict() {
  const v = new URLSearchParams(location.search).get('verdict');
  return ['pass', 'fail', 'unreadable'].includes(v) ? v : undefined;
}

async function startRun() {
  Chip.boot();
  // GO AGAIN off the ending screen means the fanfare or the lament is still
  // playing. Cut it before the new run's own sounds start.
  Chip.hush();
  Chip.sfx.confirm();
  try {
    S = await api('/api/start', { lang: Lang.code, startAt: devStage() });
  } catch (e) {
    return fail(e);
  }
  Analytics.capture('run_started', { stages: S.totalStages, resumed_at: S.stageNumber });
  // Straight past the primer if this player has already agreed to the camera, or
  // has chosen the file route. Only a first run should see it.
  if (Camera.granted || Camera.mode === 'file') {
    if (Camera.granted && !Camera.live) await Camera.attach();
    return wantsIntro() ? intro() : brief();
  }
  show('primer');
}

async function requestCamera() {
  $('allow').disabled = true;
  const how = await Camera.attach();
  $('allow').disabled = false;
  if (how === 'live') { Chip.sfx.select(); return wantsIntro() ? intro() : brief(); }
  // 'nofeed' is not a refusal — permission was given, this device just will not
  // show the feed in the page. Offering "try the camera again" would be a lie,
  // so go straight into the game and use the native capture sheet per shot.
  if (how === 'nofeed') {
    Camera.mode = 'file';
    Analytics.capture('camera_native_only', { at: 'primer' });
    Chip.sfx.select();
    return wantsIntro() ? intro() : brief();
  }
  // Genuinely refused or unavailable. Say so, and offer the route that works.
  Chip.sfx.thud();
  $('primer-fallback').classList.remove('hide');
  $('allow').classList.add('hide');
}

/**
 * The feed has been taken away from us — either it never played inline, or iOS
 * has just thrown it into its own fullscreen player mid-shot. Either way the
 * player did nothing wrong, so the clock comes off them, and they get handed the
 * capture route that does work on this device.
 */
function onInlineBlocked() {
  Camera.mode = 'file';
  Clock.stop();
  Camera.stop();
  const open = document.querySelector('.screen.on');
  const midShot = !!(open && open.id === 'screen-cam');
  Analytics.capture('camera_native_only', { at: midShot ? 'mid_shot' : 'attach' });
  if (!midShot) return;
  toast(Lang.t('cam_native'));
  // A beat, so the toast is read before the OS sheet covers everything.
  setTimeout(() => { if (document.querySelector('.screen.on') === open) $('file').click(); }, 900);
}

/* ---- stage brief ---- */
/**
 * A holding frame for a stage whose diorama hasn't been generated yet. Reads as
 * deliberately unfinished — bars on charcoal, room named — rather than
 * pretending to be art.
 */
function placeholderArt(st) {
  const ph = document.createElement('div');
  ph.className = 'stage-ph';
  const name = document.createElement('div');
  name.className = 'ph-name';
  name.textContent = Lang.up(st.scene);
  const note = document.createElement('div');
  note.className = 'ph-note';
  note.textContent = 'ART PENDING';
  ph.append(name, note);
  return ph;
}

function renderArt(host, st) {
  host.innerHTML = '';
  // The server only sends a path when the PNG is really there, so a missing
  // diorama never costs a failed request. `npm run art` fills them in.
  if (!st.art) {
    host.appendChild(placeholderArt(st));
  } else {
    const img = document.createElement('img');
    img.alt = st.scene;
    img.src = st.art;
    img.addEventListener('error', () => img.replaceWith(placeholderArt(st)));
    host.appendChild(img);
  }

  const bubble = speakable(st.ask, st.vocab, st.voice);
  bubble.className = 'bubble';
  host.appendChild(bubble);
}

/**
 * The quiet control under the brief that offers the whole line. Only built when
 * there is something to offer: an English run, or a language we have no
 * translation for, simply doesn't get one.
 */
function renderAssist(host, st) {
  host.innerHTML = '';
  if (!st || !st.askLocal) return;
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = Lang.t('translate');
  b.addEventListener('click', () => {
    // Both copies of the line, so the brief and the camera card stay in step.
    Assist.toggleSentence(
      [document.querySelector('#brief-art .bubble'), document.querySelector('#screen-cam .ask')],
      st.askLocal,
    );
  });
  host.appendChild(b);
}

/* =========================================================================
   INTRO

   Two stills before the first cell, each with one line, read aloud like
   everything else he says. The lines stay English in every language for the
   same reason the asks do: an English voice is reading them.

   It plays once a visit. A player who has just been caught and pressed GO
   AGAIN does not need telling again why he wants out — so ?intro=1 forces it
   back for testing, ?intro=0 kills it, and a ?stage=N jump skips it, that
   being a debugging entrance rather than the front door.
   ========================================================================= */
const INTRO_BEATS = ['intro_1', 'intro_2'];
let introStep = 0;
let introSeen = false;

function wantsIntro() {
  const q = new URLSearchParams(location.search);
  if (q.get('intro') === '1') return true;
  if (q.get('intro') === '0' || devStage()) return false;
  return !introSeen;
}

function paintIntro() {
  const host = $('intro-art');
  host.innerHTML = '';
  // Same contract as the stage art: the server names the file only when it is
  // really on disk, so a missing still is a holding frame and never a 404.
  const src = (S && S.intro) ? S.intro[introStep] : null;
  const label = { scene: 'Intro ' + (introStep + 1) };
  if (!src) {
    host.appendChild(placeholderArt(label));
  } else {
    const img = document.createElement('img');
    img.alt = '';
    img.src = src;
    img.addEventListener('error', () => img.replaceWith(placeholderArt(label)));
    host.appendChild(img);
  }

  const line = Lang.t(INTRO_BEATS[introStep]);
  const voiceUrl = (S && S.introVoice) ? S.introVoice[introStep] : null;
  const bubble = speakable(line, null, voiceUrl);
  bubble.className = 'bubble';
  host.appendChild(bubble);

  const beats = $('intro-beats');
  beats.innerHTML = '';
  INTRO_BEATS.forEach((_, i) => {
    const pip = document.createElement('span');
    pip.className = 'beat-pip' + (i <= introStep ? ' on' : '');
    beats.appendChild(pip);
  });

  const last = introStep === INTRO_BEATS.length - 1;
  $('intro-go').textContent = Lang.t(last ? 'intro_go' : 'intro_next');
  Speech.say(line, voiceUrl);
  Analytics.capture('intro_beat', { beat: introStep + 1 });
}

function intro() {
  introStep = 0;
  Chip.startIntro();
  paintIntro();
  show('intro');
}

/**
 * However the intro ends, the bed has to go with it. stopIntro() only cancels
 * the next loop; hush() is what silences the four bars already scheduled, which
 * would otherwise play on over the first cell.
 */
function endIntro() {
  introSeen = true;
  Chip.stopIntro();
  Chip.hush();
  Speech.stop();
}

function introNext() {
  if (introStep < INTRO_BEATS.length - 1) {
    introStep++;
    Chip.sfx.select();
    Chip.introLift();   // the mood turn, over the same loop
    return paintIntro();
  }
  endIntro();
  Chip.sfx.confirm();
  brief();
}

function introSkip() {
  Analytics.capture('intro_skipped', { beat: introStep + 1 });
  endIntro();
  Chip.sfx.select();
  brief();
}

function brief() {
  if (!S.stage) return ending(null);
  paintHud('brief');
  // New line, so any help showing for the last one goes.
  Assist.reset(S.stage.id);
  renderArt($('brief-art'), S.stage);
  renderAssist($('brief-assist'), S.stage);
  show('brief');
  Speech.say(S.stage.ask, S.stage.voice);
  Analytics.capture('stage_started', { stage: S.stage.id, stage_number: S.stageNumber });
}

/* ---- camera ---- */
async function openCamera() {
  Chip.sfx.select();
  if (Camera.mode === 'file') return $('file').click();
  const how = await Camera.attach();
  if (how !== 'live') {
    const native = how === 'nofeed';
    Camera.mode = 'file';
    Analytics.capture(native ? 'camera_native_only' : 'camera_fallback_used', { at: 'open' });
    toast(Lang.t(native ? 'cam_native' : 'cam_denied'));
    return $('file').click();
  }
  paintHud('cam');
  // The card is about to be rebuilt, so whatever help was open on it is gone
  // from the DOM — zero the bookkeeping with it, or the clock stays paused
  // against a gloss nobody can see. A retry also gets to meet the line in
  // English again, which is the point.
  Assist.closeAll();
  // Rebuilt rather than cloned, so the keywords here are live too: the ask card
  // is the copy the player is actually looking at while hunting for the object.
  const ask = $('cam-ask');
  ask.innerHTML = '';
  ask.dataset.speak = S.stage.ask;
  if (S.stage.voice) ask.dataset.speakVoice = S.stage.voice;
  const line = document.createElement('span');
  line.className = 'line';
  line.append(...markVocab(S.stage.ask, S.stage.vocab));
  const icon = document.createElement('span');
  icon.className = 'say';
  icon.textContent = '🔊';
  ask.append(line, icon);
  renderAssist($('cam-assist'), S.stage);
  show('cam');
  Clock.start(S.shotSeconds, timeUp);
}

async function shoot() {
  if (busy) return;
  const shot = Camera.capture();
  if (!shot) return toast('The camera gave us an empty frame — try again.');
  Clock.stop();
  Chip.sfx.blip();
  Analytics.capture('picture_taken', {
    stage: S.stage.id, stage_number: S.stageNumber,
    attempt: (S.attemptsPerStage - S.attemptsLeft) + 1, source: 'camera',
  });
  submit(shot);
}

/**
 * The clock hit zero. Show whatever the viewfinder was pointing at when it did —
 * it costs nothing, and an empty panel reads as a bug where a stamped frame reads
 * as "that's what you had". Falls back to the panel if the grab fails.
 */
async function timeUp() {
  if (busy) return;
  busy = true;
  // Same bookkeeping submit() does. Without it a run whose very first action is
  // a timeout reaches verdict() with judged still null, and the analytics line
  // dereferences it — which is the most likely way to time out, not the least.
  judged = S.stage;
  judgedAttempt = (S.attemptsPerStage - S.attemptsLeft) + 1;
  const shot = Camera.capture();
  // The go is gone: klaxon now. If that was the last one, ending() adds the
  // game-over sting on top, which is the right escalation.
  Chip.sfx.buzz();
  let out;
  try {
    out = await api('/api/timeout', { sessionId: S.sessionId });
  } catch (e) {
    busy = false;
    return fail(e);
  }
  busy = false;
  verdict(out, shot);
}

async function onFile(e) {
  Clock.stop();
  const input = e.target;
  const file = input.files && input.files[0];
  if (!file || busy) { input.value = ''; return; }
  let shot = null;
  try {
    shot = await Camera.fromFile(file);
  } finally {
    // Cleared only after the file has been read, not before: clearing the input
    // can drop the browser's handle on the underlying blob, and then a perfectly
    // good photo fails to decode. Doing it at all is what lets the player pick
    // the same file twice in a row and still get a change event.
    input.value = '';
  }
  // Not an error screen: they picked a file we couldn't decode, which costs them
  // nothing and shouldn't cost them the run either.
  if (!shot) return toast("Couldn't read that one — try another photo.");
  Chip.sfx.blip();
  Analytics.capture('picture_taken', {
    stage: S.stage.id, stage_number: S.stageNumber,
    attempt: (S.attemptsPerStage - S.attemptsLeft) + 1, source: 'file',
  });
  submit(shot);
}

/* =========================================================================
   THE SHOT CLOCK

   Fifteen seconds from the viewfinder opening to the shutter. Running out costs
   an attempt, same as a wrong object — one currency, so the tally marks stay
   the only thing the player has to keep an eye on.

   Two deliberate exemptions. It does not run in file-picker mode: the OS photo
   picker is a modal sheet over the whole screen, and a clock draining behind it
   that the player cannot see is a trap rather than a challenge. And it pauses
   when the tab goes away, so coming back to a dead run can't happen.
   ========================================================================= */
const Clock = (() => {
  let timer = null, left = 0, total = 15, onExpire = null, paused = false;

  function paint() {
    const el = $('clock');
    $('clock-num').textContent = left;
    $('clock-fill').style.width = Math.max(0, (left / total) * 100) + '%';
    el.classList.toggle('warn', left <= 10 && left > 5);
    el.classList.toggle('hot', left <= 5);
  }

  function beat() {
    if (paused) return;
    left -= 1;
    paint();
    // A pip every second the whole way down, doubling up for the last five.
    if (left > 5) Chip.sfx.pip();
    else if (left > 0) Chip.sfx.pipHot();
    if (left <= 0) {
      stop();
      if (onExpire) onExpire();
    }
  }

  function stop() {
    clearInterval(timer); timer = null; paused = false;
    $('clock').classList.add('hide');
    document.querySelector('.cam').classList.remove('timed');
  }

  return {
    get running() { return !!timer; },
    start(seconds, expired) {
      stop();
      total = Math.max(5, Number(seconds) || 15);
      left = total;
      onExpire = expired;
      paused = false;
      $('clock').classList.remove('hide', 'warn', 'hot');
      document.querySelector('.cam').classList.add('timed');
      // No transition on the first paint, or the bar visibly slides in from empty.
      $('clock-fill').style.transition = 'none';
      paint();
      requestAnimationFrame(() => { $('clock-fill').style.transition = ''; });
      timer = setInterval(beat, 1000);
    },
    stop,
    pause() { if (timer) paused = true; },
    resume() { paused = false; },
  };
})();

/* ---- the judge ---- */
function startNotes() {
  const notes = Lang.notes();
  let i = 0;
  $('judge-note').textContent = notes[0] || '';
  stopNotes();
  noteTimer = setInterval(() => { $('judge-note').textContent = notes[++i % notes.length]; }, 1600);
}
function stopNotes() { clearInterval(noteTimer); noteTimer = null; }

async function submit(shot) {
  busy = true;
  Clock.stop();
  judged = S.stage;
  judgedAttempt = (S.attemptsPerStage - S.attemptsLeft) + 1;

  const host = $('judge-shot');
  host.innerHTML = '';
  host.classList.add('busy');
  const img = new Image();
  img.src = shot.dataURL;
  host.appendChild(img);
  startNotes();
  show('judge');
  Chip.startLoading();
  Analytics.capture('photo_submitted', { stage: judged.id, stage_number: S.stageNumber, attempt: judgedAttempt });

  let out;
  try {
    out = await api('/api/judge', { sessionId: S.sessionId, image: shot.dataURL, mime: shot.mime, force: devVerdict() });
  } catch (e) {
    busy = false;
    return fail(e);
  } finally {
    Chip.stopLoading();
    stopNotes();
  }
  busy = false;
  verdict(out, shot);
}

function verdict(out, shot) {
  const kind = out.verdict;               // pass | fail | unreadable | error | timeout
  // Anything that actually cost an attempt. A timeout costs one; an unreadable
  // photo or a wobbly API call do not.
  const wasted = kind === 'fail' || kind === 'timeout';
  S = Object.assign({}, S, out);

  Analytics.capture('verdict', {
    stage: judged.id, stage_number: out.stageNumber, verdict: kind,
    object: out.object, confidence: out.confidence, latency_ms: out.latencyMs,
  });
  // Feedback on whether the photo itself was right, as distinct from 'verdict'
  // above (which also covers the non-judgment outcomes: unreadable, error,
  // timeout). Unreadable/error/timeout never actually judged an object, so
  // there's no correct/incorrect answer to report for them.
  if (kind === 'pass' || kind === 'fail') {
    Analytics.capture('picture_feedback_given', {
      stage: judged.id, stage_number: out.stageNumber, attempt: judgedAttempt,
      answer: kind === 'pass' ? 'correct' : 'incorrect',
      object: out.object, confidence: out.confidence,
    });
  }
  if (kind === 'pass') Analytics.capture('stage_passed', { stage: judged.id, attempts_used: judgedAttempt });
  if (wasted && out.over !== 'caught') Analytics.capture('stage_failed', { stage: judged.id, attempt: judgedAttempt, attempts_left: out.attemptsLeft, timed_out: kind === 'timeout' });

  // Caught or out: the ending screen carries the punk's last line, so the run
  // doesn't stop on a verdict card and then stop again on a result card.
  if (out.over) return ending(out);

  paintHud('v');
  const host = $('v-shot');
  host.innerHTML = '';
  host.classList.remove('busy');
  host.classList.toggle('empty', !shot);
  const stamp = document.createElement('div');
  stamp.className = 'stamp ' + (kind === 'pass' ? 'pass' : wasted ? 'fail' : 'soft');
  stamp.textContent = Lang.t('verdict_' + (kind === 'error' ? 'error' : kind));
  if (shot) {
    const img = new Image();
    img.src = shot.dataURL;
    host.append(img, stamp);
  } else {
    const none = document.createElement('span');
    none.className = 'none';
    none.textContent = 'NO PHOTO';
    host.append(none, stamp);
  }

  const line = $('v-line');
  line.innerHTML = '';
  line.append(speakable(out.reason).firstChild.cloneNode(true));
  const icon = document.createElement('span');
  icon.className = 'say';
  icon.textContent = '🔊';
  line.appendChild(icon);

  // An unreadable photo or a wobbly API call cost nothing, and the player is
  // told so plainly — otherwise it looks like the counter is broken.
  $('v-free').classList.toggle('hide', wasted || kind === 'pass');
  const go = $('v-go');
  go.textContent = kind === 'pass' ? Lang.t('onward')
    : S.attemptsLeft === 1 && wasted ? Lang.t('last_chance')
    : Lang.t('retry');
  go.dataset.next = kind === 'pass' ? 'brief' : 'cam';

  // The timeout already played its klaxon on the way in; don't stack another.
  if (kind !== 'timeout') Chip.sfx[kind === 'pass' ? 'confirm' : wasted ? 'thud' : 'blip']();
  Speech.say(out.reason, out.voice);
  show('verdict');
}

/* ---- endings ---- */
function ending(out) {
  const won = S.over === 'escaped';
  Clock.stop();
  Camera.stop();
  Chip.stopLoading();

  $('end-verdict').textContent = Lang.t(won ? 'escaped_title' : 'caught_title');
  $('end-verdict').className = 'verdict ' + (won ? 'win' : 'lose');
  // A warm charcoal for getting out, a cold one for getting caught.
  document.body.dataset.outcome = won ? 'win' : 'lose';

  // The punk's last line, the narrator's line and the stat are three different
  // voices. Running them into one paragraph made all three read worse.
  const line = $('end-line');
  line.innerHTML = '';
  if (out && out.reason) {
    line.classList.remove('hide');
    line.append(speakable(out.reason).firstChild.cloneNode(true));
    const icon = document.createElement('span');
    icon.className = 'say';
    icon.textContent = '🔊';
    line.appendChild(icon);
  } else {
    line.classList.add('hide');
  }
  $('end-sub').textContent = Lang.t(won ? 'escaped_sub' : 'caught_sub');
  $('end-got').textContent = !won && judged ? Lang.t('caught_far', { scene: Lang.up(judged.scene) }) : '';

  const items = (S.evidence || []);
  $('end-loot').classList.toggle('hide', !items.length);
  const grid = $('end-grid');
  grid.innerHTML = '';
  items.forEach(it => {
    const card = document.createElement('button');
    card.className = 'loot-item';
    card.dataset.say = '';
    const where = document.createElement('span');
    where.className = 'where';
    where.textContent = Lang.up(it.scene);
    const what = document.createElement('span');
    what.className = 'what line';
    what.textContent = it.object;
    card.append(where, what);
    // The run ends with all seven target phrases back on screen, each next to
    // the real object this child went and found for it. The list was already
    // here; naming the words turns it into a review rather than a receipt.
    if (it.words) {
      const w = document.createElement('span');
      w.className = 'learned';
      w.textContent = it.words;
      card.appendChild(w);
    }
    grid.appendChild(card);
  });

  Chip.sfx[won ? 'win' : 'lose']();
  Speech.say(out && out.reason ? out.reason : '', out && out.voice);
  show('end');
  Analytics.capture(won ? 'run_escaped' : 'run_caught', {
    stage_reached: judged ? judged.id : null,
    stage_number: S.stageNumber,
    objects_found: items.length,
    duration_ms: out ? out.durationMs : null,
  });
}

/* =========================================================================
   WIRING
   ========================================================================= */
$('mute').addEventListener('click', () => {
  const muted = Chip.toggle();
  if (muted) Speech.stop();
  $('mute').textContent = muted ? '🔇' : '🔊';
});

$('unlock').addEventListener('click', unlock);
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

$('allow').addEventListener('click', requestCamera);
$('cam-retry').addEventListener('click', () => {
  $('primer-fallback').classList.add('hide');
  $('allow').classList.remove('hide');
  requestCamera();
});
$('pick-instead').addEventListener('click', () => {
  Camera.mode = 'file';
  Analytics.capture('camera_fallback_used', {});
  if (wantsIntro()) return intro();
  brief();
});

$('intro-go').addEventListener('click', introNext);
$('intro-skip').addEventListener('click', introSkip);

$('brief-go').addEventListener('click', openCamera);
$('shoot').addEventListener('click', shoot);
$('use-file').addEventListener('click', () => { Camera.mode = 'file'; $('file').click(); });
$('file').addEventListener('change', onFile);
$('v-go').addEventListener('click', () => {
  Chip.sfx.select();
  if ($('v-go').dataset.next === 'brief') brief(); else openCamera();
});
$('end-again').addEventListener('click', () => { Speech.stop(); startRun(); });

/**
 * FINISH — the only thing in the game that completes the quest. The app closes
 * the webview when it gets the message, so normally this button's own state is
 * never seen again. If it IS still here four seconds later the message did not
 * land, and saying so beats leaving a dead button: a second tap sends another,
 * which cannot double-pay, because a webview that received the first one would
 * have closed before the child could tap again.
 */
$('end-finish').addEventListener('click', () => {
  const btn = $('end-finish');
  if (btn.disabled) return;
  btn.disabled = true;
  Speech.stop();
  Chip.hush();
  Chip.sfx.confirm();
  Analytics.capture('quest_finished', {
    outcome: document.body.dataset.outcome || null,
    objects_found: (S && S.evidence ? S.evidence.length : 0),
    attempt: Bridge.endSends + 1,
  });
  Bridge.finish();
  setTimeout(() => {
    btn.disabled = false;
    toast(Lang.t('finish_wait'));
  }, 4000);
});
$('err-again').addEventListener('click', () => { Speech.stop(); show('title'); armTitle(); });

// Space is the shutter, and only that — nothing else on this screen wants it.
document.addEventListener('keydown', e => {
  if (e.key !== ' ' && e.key !== 'Enter') return;
  if (document.activeElement && /INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)) return;
  const open = document.querySelector('.screen.on');
  if (!open) return;
  e.preventDefault();
  if (open.id === 'screen-cam') shoot();
  else if (open.id === 'screen-intro') introNext();
  else if (open.id === 'screen-brief') openCamera();
  else if (open.id === 'screen-verdict') $('v-go').click();
});

// Release the camera when the tab goes away, so the recording indicator goes
// out, and pick it back up on return if the viewfinder is what's on screen.
document.addEventListener('visibilitychange', () => {
  // The clock pauses rather than stops: a phone call or a notification shouldn't
  // burn an attempt, and it shouldn't hand out free time either.
  if (document.hidden) { Clock.pause(); Camera.stop(); Speech.stop(); return; }
  const open = document.querySelector('.screen.on');
  if (open && open.id === 'screen-cam') { Camera.attach(); Clock.resume(); }
});

// Best-effort: tell the server a run is done with, rather than leaving it to
// time out. sendBeacon is the only thing that reliably survives a page unload.
window.addEventListener('pagehide', () => {
  try {
    if (S && S.sessionId && navigator.sendBeacon) {
      navigator.sendBeacon('/api/abandon', new Blob([JSON.stringify({ sessionId: S.sessionId })], { type: 'application/json' }));
    }
  } catch { /* nothing to do about it */ }
});

boot();
</script>
</body>
</html>
