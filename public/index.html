<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JAILBREAK: CAMERA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141419">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141419; --panel:#1e1e26; --panel-2:#262630;
    --ink:#ececf4; --dim:#8e8ea6; --line:#3a3a4a;
    --purple:#8b5cf6; --purple-dk:#5b21b6; --purple-lt:#c4a6ff;
    --blue:#3b82f6; --green:#4ade80; --red:#f87171; --amber:#fbbf24;
    /* Pixel font for chrome — logo, buttons, HUD. Short strings only. */
    --pix: 'Press Start 2P', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    /* Everything you actually have to READ uses this, bigger and with air. */
    --body: 'Space Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--body);
    display:flex; align-items:center; justify-content:center;
    padding:16px; overflow-x:hidden;
  }
  /* pixel font wants no smoothing; the reading font very much does */
  .logo,.btn,.hud,.load-title,.verdict,.foot,.mute,.prompt,.tag,.loot h4,.err h3,.stage-ph .ph-name{
    font-family:var(--pix); -webkit-font-smoothing:none;
  }
  /* faint CRT wash over everything */
  body::after{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:999;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply; opacity:.55;
  }
  #app{width:100%; max-width:540px;}
  .screen{display:none; animation:fadein .18s steps(3);}
  .screen.on{display:block;}
  @keyframes fadein{from{opacity:0}to{opacity:1}}

  /* ---------- chunky pixel components ---------- */
  .panel{
    background:var(--panel); border:4px solid var(--line);
    box-shadow:0 0 0 4px var(--bg), 0 8px 0 4px rgba(0,0,0,.5);
    padding:16px;
  }
  .btn{
    font-size:12px; line-height:1.7; color:var(--ink);
    background:var(--panel-2); border:3px solid var(--line);
    box-shadow:0 5px 0 0 #0d0d12; padding:13px 12px; width:100%;
    cursor:pointer; text-align:left; display:flex; gap:11px; align-items:center;
    transition:transform .05s steps(2), background .05s;
  }
  .btn:hover:not(:disabled){background:var(--purple-dk); border-color:var(--purple);}
  .btn:active:not(:disabled){transform:translateY(5px); box-shadow:0 0 0 0 #0d0d12;}
  .btn:disabled{opacity:.32; cursor:default;}
  .btn.big{
    justify-content:center; text-align:center; font-size:15px; padding:20px;
    background:var(--purple); border-color:var(--purple-lt); color:#fff;
    text-shadow:0 3px 0 rgba(0,0,0,.45);
  }
  .btn.big:hover{background:#9d70ff;}
  .btn.ghost{justify-content:center; text-align:center; font-size:10px; padding:12px; color:var(--dim); box-shadow:none;}
  .btn.ghost:hover{color:var(--ink);}

  /* ---------- title ---------- */
  #screen-title{text-align:center; padding:8px 0;}
  .logo{margin:26px 0 6px; line-height:1.55;}
  .logo .l1{font-size:19px; color:var(--purple-lt); text-shadow:0 4px 0 var(--purple-dk);}
  .logo .l2{
    font-size:36px; color:#fff; margin-top:12px; letter-spacing:1px;
    text-shadow:0 0 0 #000, 4px 4px 0 var(--purple), 8px 8px 0 rgba(0,0,0,.55);
    animation:bob 1.6s steps(2) infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .bars{height:14px; margin:24px 0; background:repeating-linear-gradient(90deg,var(--purple) 0 14px, transparent 14px 28px); opacity:.8;}
  .blink{animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0}}
  .tag{font-size:9px; color:var(--dim); line-height:2; margin-bottom:22px;}

  /* ---------- HUD ---------- */
  .hud{display:flex; justify-content:space-between; align-items:center; font-size:9px; color:var(--dim); margin-bottom:10px; gap:10px;}
  .hud .scene{color:var(--purple-lt); text-align:right; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* Attempts, drawn as scratched tally marks on the cell wall. A struck-through
     mark is a spent go; the amber one is the go you are on. */
  .tally{display:flex; gap:7px; flex:none; align-items:center;}
  .mark{position:relative; width:5px; height:19px; background:#4a4a5c; transform:rotate(-7deg);}
  .mark.now{background:var(--amber); animation:blink 1.1s steps(1) infinite;}
  .mark.spent{background:#33333f;}
  .mark.spent::after{
    content:''; position:absolute; left:-7px; top:8px; width:19px; height:3px;
    background:var(--red); transform:rotate(24deg);
  }

  /* ---------- stage art ---------- */
  .stage{position:relative; border:4px solid var(--line); background:#0d0d12; box-shadow:0 8px 0 4px rgba(0,0,0,.5); overflow:hidden;}
  .stage img{display:block; width:100%; aspect-ratio:1/1; object-fit:cover;}
  .stage::after{content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.45) 100%);}

  /* Shown until assets/stage-N.png exists. Deliberately reads as a holding
     frame rather than pretending to be art: bars on charcoal, scene named. */
  .stage-ph{
    aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; position:relative;
    background:
      repeating-linear-gradient(90deg, rgba(58,58,74,.85) 0 12px, transparent 12px 46px),
      linear-gradient(180deg, #23232c 0%, #17171d 100%);
  }
  .stage-ph .ph-name{font-size:13px; color:var(--purple-lt); text-align:center; padding:0 24px; line-height:1.9; text-shadow:0 3px 0 rgba(0,0,0,.7);}
  .stage-ph .ph-note{position:absolute; bottom:10px; right:12px; font-family:var(--pix); font-size:7px; color:#4a4a5c;}

  .bubble{
    position:absolute; left:12px; right:12px; bottom:12px; z-index:3;
    background:#fff; color:#15151b; border:4px solid #0d0d12;
    padding:13px 14px; font-size:15px; line-height:1.55; font-weight:700;
    box-shadow:0 5px 0 rgba(0,0,0,.5);
  }
  .bubble::before{
    content:''; position:absolute; top:-16px; left:26px;
    border:8px solid transparent; border-bottom-color:#0d0d12;
  }
  /* The punk's line is English in every language, so it is always something you
     can tap to hear. Click only, deliberately: space already fires the shutter. */
  [data-say]{cursor:pointer; position:relative;}
  [data-say]:active{transform:translateY(2px);}
  .say{opacity:.45; font-size:.8em; margin-left:6px; transition:opacity .1s;}
  [data-say]:hover .say{opacity:1;}

  .below{
    background:var(--panel); border:4px solid var(--line); border-top:0;
    padding:16px; box-shadow:0 8px 0 4px rgba(0,0,0,.5);
  }
  .prompt{font-size:9px; color:var(--dim); margin-bottom:12px; line-height:1.9;}
  .read{font-size:15px; line-height:1.75; color:#e6e6f2;}
  .read + .read{margin-top:12px;}
  .read.small{font-size:13px; color:#a8a8c0;}

  /* ---------- camera ---------- */
  .cam{position:relative; border:4px solid var(--line); background:#0d0d12; box-shadow:0 8px 0 4px rgba(0,0,0,.5); overflow:hidden;}
  .cam video{display:block; width:100%; aspect-ratio:3/4; object-fit:cover; background:#0d0d12;}
  /* Framing guide. Inset from the top far enough to clear the ask panel above
     it, so the dashed edge and its corner bracket aren't hidden behind it. */
  .cam .frame{
    position:absolute; inset:104px 22px 22px; pointer-events:none; z-index:2;
    border:3px dashed rgba(196,166,255,.45);
  }
  .cam .frame::before,.cam .frame::after{
    content:''; position:absolute; width:26px; height:26px; border:4px solid var(--purple-lt);
  }
  .cam .frame::before{top:-4px; left:-4px; border-right:0; border-bottom:0;}
  .cam .frame::after{bottom:-4px; right:-4px; border-left:0; border-top:0;}
  .cam .ask{
    position:absolute; left:12px; right:12px; top:12px; z-index:3;
    background:rgba(13,13,18,.86); border:3px solid var(--purple-dk);
    padding:10px 12px; font-size:13px; line-height:1.5; font-weight:700; color:#fff;
  }
  /* The shot clock. A bar draining across the bottom edge of the viewfinder plus
     a numeral, because a bar alone reads as "some time left" and a number alone
     is easy to miss while you are hunting round the room. */
  .clock{
    position:absolute; left:0; right:0; bottom:0; z-index:4; height:34px;
    background:rgba(13,13,18,.86); border-top:3px solid var(--line);
    display:flex; align-items:center; gap:10px; padding:0 12px;
  }
  .clock .num{font-family:var(--pix); font-size:13px; color:var(--purple-lt); flex:none; min-width:34px;}
  .clock .rail{flex:1; height:9px; background:#0d0d12; border:2px solid var(--line); overflow:hidden;}
  .clock .fill{height:100%; width:100%; background:var(--purple); transition:width .95s linear;}
  /* Two thresholds, matching where the ticking starts and where it tightens. */
  .clock.warn .num{color:var(--amber);}
  .clock.warn .fill{background:var(--amber); transition:width .95s linear;}
  .clock.hot .num{color:var(--red); animation:blink .5s steps(1) infinite;}
  .clock.hot .fill{background:var(--red);}
  /* The framing guide stops short of the clock rather than running under it. */
  .cam.timed .frame{bottom:48px;}

  .shutter{
    margin-top:14px; width:100%; padding:22px; font-family:var(--pix); font-size:15px;
    background:var(--purple); border:4px solid var(--purple-lt); color:#fff;
    box-shadow:0 6px 0 0 #0d0d12; cursor:pointer; text-shadow:0 3px 0 rgba(0,0,0,.45);
    display:flex; align-items:center; justify-content:center; gap:12px;
  }
  .shutter:hover:not(:disabled){background:#9d70ff;}
  .shutter:active:not(:disabled){transform:translateY(6px); box-shadow:0 0 0 0 #0d0d12;}
  .shutter:disabled{opacity:.4; cursor:default;}
  .shutter .lens{width:17px; height:17px; border-radius:50%; border:4px solid #fff; flex:none;}
  .cam-hint{text-align:center; font-family:var(--pix); font-size:8px; color:#4a4a5c; margin-top:12px; line-height:2;}

  /* the frame we just took, being looked at */
  .shot{position:relative; border:4px solid var(--line); background:#0d0d12; box-shadow:0 8px 0 4px rgba(0,0,0,.5); overflow:hidden;}
  .shot img{display:block; width:100%; aspect-ratio:3/4; object-fit:cover;}
  .shot.busy::after{
    content:''; position:absolute; left:0; right:0; height:44%; z-index:2;
    background:linear-gradient(180deg, transparent, rgba(139,92,246,.30) 60%, rgba(196,166,255,.75));
    animation:scan 1.15s steps(14) infinite;
  }
  @keyframes scan{0%{top:-44%}100%{top:100%}}
  .shot .stamp{
    position:absolute; left:0; right:0; bottom:0; z-index:3; padding:12px;
    font-family:var(--pix); font-size:11px; text-align:center; color:#fff;
    background:rgba(13,13,18,.9); border-top:3px solid var(--line);
  }
  .shot .stamp.pass{color:var(--green); border-top-color:var(--green);}
  .shot .stamp.fail{color:var(--red); border-top-color:var(--red);}
  .shot .stamp.soft{color:var(--amber); border-top-color:var(--amber);}
  /* Nothing was photographed, so there is nothing to show but the fact of it. */
  .shot.empty{
    aspect-ratio:3/4; display:flex; align-items:center; justify-content:center;
    background:repeating-linear-gradient(135deg, #17171d 0 14px, #1e1e26 14px 28px);
  }
  .shot.empty .none{font-family:var(--pix); font-size:11px; color:#4a4a5c; letter-spacing:2px;}

  .load-title{font-size:13px; color:var(--purple-lt); text-align:center; margin-bottom:14px;}
  .load-note{font-family:var(--body); font-size:13px; color:#a8a8c0; text-align:center; min-height:34px; line-height:1.8; margin-top:12px;}

  .free{font-family:var(--pix); font-size:8px; color:var(--amber); margin-top:12px; line-height:2;}

  /* ---------- endings ---------- */
  .card{text-align:center; padding:22px 16px;}
  .card .verdict{font-size:26px; line-height:1.5; text-shadow:0 4px 0 rgba(0,0,0,.5); margin-bottom:10px;}
  .card .verdict.win{color:var(--green);}
  .card .verdict.lose{color:var(--red);}
  .card .got{font-family:var(--pix); font-size:9px; color:var(--amber); margin-top:16px; line-height:2;}
  body:not([data-lang="en"]) .card .got{font-family:var(--body); font-size:12px;}

  .loot{margin-top:22px; border-top:3px solid var(--line); padding-top:16px; text-align:left;}
  .loot h4{font-size:10px; color:var(--purple-lt); font-weight:normal; margin-bottom:6px;}
  .loot-hint{margin-bottom:14px; font-family:var(--pix); font-size:8px; color:#4a4a5c; line-height:2;}
  .loot-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:9px;}
  .loot-item{
    background:var(--panel-2); border:3px solid var(--line); box-shadow:0 4px 0 0 #0d0d12;
    padding:10px 11px; text-align:left; color:var(--ink); cursor:pointer;
    transition:transform .05s steps(2), background .05s;
  }
  .loot-item:hover{background:var(--purple-dk); border-color:var(--purple);}
  .loot-item:active{transform:translateY(4px); box-shadow:0 0 0 0 #0d0d12;}
  .loot-item .where{display:block; font-family:var(--pix); font-size:7px; color:var(--dim); line-height:1.8;}
  .loot-item .what{display:block; margin-top:7px; font-size:14px; line-height:1.5; word-break:break-word;}

  /* ---------- language picker ---------- */
  .lang-label{font-family:var(--pix); font-size:8px; color:#4a4a5c; margin-top:26px;}
  .langs{display:flex; gap:6px; justify-content:center; margin-top:10px; flex-wrap:wrap;}
  .lang-chip{
    font-family:var(--body); font-size:12px; letter-spacing:.5px;
    background:var(--panel-2); color:var(--dim); border:2px solid var(--line);
    padding:8px 11px; cursor:pointer;
  }
  .lang-chip:hover{color:var(--ink); border-color:var(--purple);}
  .lang-chip.on{background:var(--purple-dk); border-color:var(--purple-lt); color:#fff;}

  /* Outside English, localised chrome moves to the reading font. Press Start 2P's
     coverage of Latin-Extended (Turkish ğ ş ı İ) is unverified, and one
     consistent switch looks far better than per-glyph fallback inside a word.
     The English build is untouched, and anything that stays English in every
     language — the logo, the punk's lines — keeps the pixel font throughout. */
  body:not([data-lang="en"]) .btn.big,
  body:not([data-lang="en"]) .btn.ghost,
  body:not([data-lang="en"]) .hud,
  body:not([data-lang="en"]) .load-title,
  body:not([data-lang="en"]) .verdict,
  body:not([data-lang="en"]) .foot,
  body:not([data-lang="en"]) .tag,
  body:not([data-lang="en"]) .prompt,
  body:not([data-lang="en"]) .free,
  body:not([data-lang="en"]) .cam-hint,
  body:not([data-lang="en"]) .loot h4,
  body:not([data-lang="en"]) .loot-hint,
  body:not([data-lang="en"]) .shot .stamp,
  body:not([data-lang="en"]) .err h3{
    font-family:var(--body); -webkit-font-smoothing:antialiased;
  }
  body:not([data-lang="en"]) .btn.big{font-size:17px;}
  body:not([data-lang="en"]) .btn.ghost{font-size:13px;}
  body:not([data-lang="en"]) .hud{font-size:11px;}
  body:not([data-lang="en"]) .tag{font-size:12px; line-height:1.9;}
  body:not([data-lang="en"]) .prompt{font-size:12px;}
  body:not([data-lang="en"]) .free,
  body:not([data-lang="en"]) .cam-hint,
  body:not([data-lang="en"]) .loot-hint{font-size:11px;}
  body:not([data-lang="en"]) .load-title{font-size:15px;}
  body:not([data-lang="en"]) .shot .stamp{font-size:14px;}
  body:not([data-lang="en"]) .loot h4{font-size:12px;}
  body:not([data-lang="en"]) .err h3{font-size:15px;}
  body:not([data-lang="en"]) .foot{font-size:11px; line-height:1.8;}

  /* ---------- error + gate ---------- */
  .err{border-color:var(--red);}
  .err h3{font-size:13px; color:var(--red); margin-bottom:12px;}
  .err pre{font-family:var(--body); font-size:13px; line-height:1.7; color:#a8a8c0; white-space:pre-wrap; word-break:break-word; background:#0d0d12; padding:11px; border:2px solid var(--line); margin-bottom:14px; max-height:190px; overflow:auto;}
  .code-input{
    font-family:var(--pix); font-size:20px; letter-spacing:6px; text-align:center;
    width:100%; padding:16px 12px; color:var(--purple-lt); background:#0d0d12;
    border:3px solid var(--line); outline:none;
  }
  .code-input:focus{border-color:var(--purple);}
  .code-err{min-height:22px; margin-top:12px; font-size:13px; color:var(--red);}

  .mute{position:fixed; top:12px; right:12px; z-index:1000; width:auto; padding:9px 11px; font-size:11px; background:var(--panel-2); border:3px solid var(--line); box-shadow:none; color:var(--dim); cursor:pointer; font-family:var(--pix);}
  .foot{text-align:center; font-size:8px; color:#4a4a5c; margin-top:20px; line-height:2;}

  /* A problem that isn't the player's fault and isn't worth a screen: a file we
     couldn't decode, a camera that dropped out. Says so and gets out of the way. */
  .toast{
    position:fixed; left:12px; right:12px; bottom:12px; z-index:1001; max-width:516px;
    margin:0 auto; padding:13px 14px; background:#0d0d12; color:var(--amber);
    border:3px solid var(--amber); font-size:13px; line-height:1.6; text-align:center;
    box-shadow:0 6px 0 rgba(0,0,0,.55);
  }
  .toast.hide{display:none !important;}
  .gap{margin-top:14px;}
  .hide{display:none !important;}

  @media (max-width:480px){
    .logo .l2{font-size:26px;} .logo .l1{font-size:14px;}
    .btn{font-size:10px;} .card .verdict{font-size:20px;}
    .loot-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<button class="mute" id="mute" title="Toggle sound">♪</button>

<div id="app">

  <!-- ================= ACCESS GATE ================= -->
  <section id="screen-gate" class="screen">
    <div class="panel">
      <div class="load-title" data-t="gate_title">RESTRICTED AREA</div>
      <div class="prompt" data-t="gate_hint">ACCESS CODE</div>
      <input id="code" class="code-input" type="password" autocomplete="off" inputmode="text" maxlength="40">
      <div class="code-err" id="code-err"></div>
      <button class="btn big gap" id="unlock" data-t="gate_go">UNLOCK</button>
    </div>
  </section>

  <!-- ================= TITLE ================= -->
  <section id="screen-title" class="screen on">
    <div class="logo">
      <div class="l1">JAILBREAK</div>
      <div class="l2">CAMERA</div>
    </div>
    <div class="bars"></div>
    <div class="tag" data-t="title_tag">HE CAN’T REACH ANYTHING. YOU CAN.</div>
    <button class="btn big" id="start" data-t="title_start">BREAK HIM OUT</button>
    <div class="lang-label" data-t="lang_prompt">LANGUAGE</div>
    <div class="langs" id="langs"></div>
    <div class="foot" data-t="title_foot">FIND IT · SHOOT IT · GET OUT</div>
  </section>

  <!-- ================= CAMERA PRIMER =================
       The real browser prompt is never fired cold. A denied camera permission
       is close to unrecoverable on iOS Safari, so the player is told what is
       about to be asked and why before they are asked it. -->
  <section id="screen-primer" class="screen">
    <div class="panel">
      <div class="load-title" data-t="cam_title">CAMERA CHECK</div>
      <p class="read" data-t="cam_why"></p>
      <p class="read small gap" data-t="cam_privacy"></p>
      <button class="btn big gap" id="allow" data-t="cam_allow">TURN ON THE CAMERA</button>
      <div id="primer-fallback" class="hide">
        <p class="read small gap" data-t="cam_denied"></p>
        <button class="btn ghost gap" id="pick-instead" data-t="cam_pick">CHOOSE A PHOTO</button>
        <button class="btn ghost gap" id="cam-retry" data-t="cam_retry">TRY THE CAMERA AGAIN</button>
      </div>
    </div>
  </section>

  <!-- ================= STAGE BRIEF ================= -->
  <section id="screen-brief" class="screen">
    <div class="hud">
      <span id="brief-stage">STAGE 1/7</span>
      <span class="tally" id="brief-tally"></span>
      <span class="scene" id="brief-scene"></span>
    </div>
    <div class="stage" id="brief-art"></div>
    <div class="below">
      <button class="btn big" id="brief-go" data-t="brief_go">OPEN CAMERA</button>
    </div>
  </section>

  <!-- ================= CAMERA ================= -->
  <section id="screen-cam" class="screen">
    <div class="hud">
      <span id="cam-stage">STAGE 1/7</span>
      <span class="tally" id="cam-tally"></span>
      <span class="scene" id="cam-scene"></span>
    </div>
    <div class="cam">
      <video id="video" playsinline muted autoplay></video>
      <div class="frame"></div>
      <div class="ask" id="cam-ask" data-say></div>
      <div class="clock hide" id="clock">
        <span class="num" id="clock-num">30</span>
        <span class="rail"><span class="fill" id="clock-fill"></span></span>
      </div>
    </div>
    <button class="shutter" id="shoot"><span class="lens"></span><span data-t="cam_shoot">SHOOT IT</span></button>
    <div class="cam-hint" data-t="cam_hint">HOLD IT UP AND FILL THE FRAME</div>
    <button class="btn ghost gap" id="use-file" data-t="cam_switch">PICK A PHOTO INSTEAD</button>
  </section>

  <!-- ================= JUDGING ================= -->
  <section id="screen-judge" class="screen">

<!-- Interface strings. A plain script tag, so it is guaranteed to be in place
     before the game script runs; if it fails to load the game falls back to a
     small built-in English set rather than breaking. -->
<script src="/i18n.js"></script>
<script>
/* =========================================================================
   CHIPTUNE — everything is synthesised in WebAudio. No audio files.
   ========================================================================= */
const Chip = (() => {
  let ctx = null, master = null, muted = false;
  let loadingTimer = null, themeTimer = null;

  const N = {}; // note name -> frequency
  (() => {
    const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    for (let oct = 1; oct <= 7; oct++)
      names.forEach((n, i) => { N[n + oct] = 440 * Math.pow(2, ((oct - 4) * 12 + i - 9) / 12); });
  })();

  function boot() {
    if (ctx) return ctx;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 0.30;
    master.connect(ctx.destination);
    return ctx;
  }

  /** One chiptune voice at an absolute AudioContext time. */
  function voiceAt(freq, t, dur, { type = 'square', vol = 0.5, slide = 0, vibrato = 0 } = {}) {
    if (!ctx || muted || !freq) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
    if (vibrato) {
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = 6.5; lg.gain.value = vibrato;
      lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t + dur);
    }
    // square-wave envelope: instant attack, tiny decay, hard cut
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(vol * 0.62, t + dur * 0.45);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  /** Same, but relative to "now" — what the one-shots and the theme use. */
  function voice(freq, at, dur, opts) { if (ctx) voiceAt(freq, ctx.currentTime + at, dur, opts); }

  /** White-noise burst — the drum kit. */
  function noiseAt(t, dur, { vol = 0.25, hp = 1200 } = {}) {
    if (!ctx || muted) return;
    const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t);
  }
  function noise(at, dur, opts) { if (ctx) noiseAt(ctx.currentTime + at, dur, opts); }

  /* ---- the title fanfare: heroic, dumb, in D major, ~150bpm ---- */
  const B = 0.4 / 2; // one eighth note
  const LEAD = [
    // [note, beat, length]
    ['D5',0,1],['F#5',1,1],['A5',2,1],['D6',3,2],
    ['C#6',5,1],['D6',6,4],
    ['A5',11,1],['B5',12,1],['C#6',13,1],['D6',14,2],
    ['A5',16,1],['D6',17,1],['F#6',18,1],['A6',19,3],
    ['G6',22,1],['F#6',23,1],['E6',24,1],['D6',25,5],
    [null,30,2],
  ];
  const BASS = [
    ['D3',0,2],['D3',2,2],['A2',4,2],['A2',6,2],
    ['B2',8,2],['B2',10,2],['F#2',12,2],['F#2',14,2],
    ['G2',16,2],['G2',18,2],['A2',20,2],['A2',22,2],
    ['D3',24,2],['A2',26,2],['D3',28,4],
  ];
  const BAR = 32 * B;

  function themeOnce(offset = 0) {
    LEAD.forEach(([n, b, l]) => voice(N[n], offset + b * B, l * B * 0.92, { type: 'square', vol: 0.34, vibrato: l >= 3 ? 5 : 0 }));
    BASS.forEach(([n, b, l]) => voice(N[n], offset + b * B, l * B * 0.9, { type: 'triangle', vol: 0.42 }));
    for (let i = 0; i < 32; i += 2) noise(offset + i * B, 0.05, { vol: i % 8 === 4 ? 0.3 : 0.13, hp: i % 8 === 4 ? 900 : 3000 });
  }

  function startTheme() {
    boot(); stopTheme();
    themeOnce(0.05);
    themeTimer = setInterval(() => themeOnce(0.02), BAR * 1000);
  }
  function stopTheme() { clearInterval(themeTimer); themeTimer = null; }

  /* ------------------------------------------------------------------
     LOADING TRACK — D minor, 138bpm. Three layers that arrive in turn,
     so a wait of any length has somewhere to go:

       bar 1   ostinato alone
       bar 7   melody enters (~5s in) and the ostinato ducks
       bar 17  chord stabs land on top (~14s in), ostinato ducks further

     Most turns take 15-25s, so a typical wait hears all three; a quick
     one still gets the melody, which the old 16-bar entry point missed
     almost every time. Scheduled with a lookahead against absolute
     AudioContext time, so it stays locked to the beat instead of drifting.
     ------------------------------------------------------------------ */
  const STEP = 60 / 138 / 4;   // one sixteenth
  const OST_BAR = 8;               // steps per bar (2/4)
  const MELODY_IN = 6 * OST_BAR;   // melody joins after 6 bars (~5.2s)
  const STABS_IN = 16 * OST_BAR;   // stabs land where the melody used to (~13.9s)

  // pulsing low arpeggio — the engine room
  const OST_BASS = ['D2', 'D3', 'A2', 'D3', 'F2', 'D3', 'A2', 'C3'];
  // sparse high tick that outlines the chord
  const OST_TOP  = [null, 'A4', null, 'D5', null, 'A4', null, 'F4'];

  // 8 bars, then loops. [step, note, lengthInSteps]
  const MELODY = [
    [0,'A4',4],[4,'D5',4],
    [8,'F5',2],[10,'E5',2],[12,'D5',4],
    [16,'C5',4],[20,'E5',4],
    [24,'D5',6],
    [32,'A4',4],[36,'D5',4],
    [40,'F5',2],[42,'G5',2],[44,'A5',4],
    [48,'G5',4],[52,'F5',4],
    [56,'E5',5],[61,'D5',3],
  ];
  const MELODY_LEN = 64;

  /**
   * Chord stabs — the third layer. Short, hard triads placed off the beat so
   * they punch against the ostinato instead of doubling it. Four bars of
   * i - VI - III - v in D minor (Dm, Bb, C, Am), two hits per bar.
   * Note that Bb is spelled A# here, because that's how the N table names it.
   */
  const STABS = [
    [2,  ['D4',  'F4', 'A4']],
    [6,  ['D4',  'F4', 'A4']],
    [10, ['A#3', 'D4', 'F4']],
    [14, ['A#3', 'D4', 'F4']],
    [18, ['C4',  'E4', 'G4']],
    [22, ['C4',  'E4', 'G4']],
    [26, ['A3',  'C4', 'E4']],
    [29, ['A3',  'C4', 'E4']],
  ];
  const STABS_LEN = 32;

  let step = 0, nextStepTime = 0;

  function scheduleStep(i, t) {
    const withMelody = i >= MELODY_IN;
    const withStabs = i >= STABS_IN;
    // Ostinato steps back once for the tune and again for the stabs, so the top
    // end never turns into mush no matter how long the wait runs.
    const duck = withStabs ? 0.42 : withMelody ? 0.55 : 1;
    const s = i % OST_BAR;

    voiceAt(N[OST_BASS[s]], t, STEP * 1.7, { type: 'triangle', vol: 0.30 * duck });
    if (OST_TOP[s]) voiceAt(N[OST_TOP[s]], t, STEP * 0.7, { type: 'square', vol: 0.075 * duck });
    if (s === 0) noiseAt(t, 0.05, { vol: 0.10 * duck, hp: 900 });
    if (s === 4) noiseAt(t, 0.03, { vol: 0.07 * duck, hp: 5000 });

    if (withMelody) {
      const m = (i - MELODY_IN) % MELODY_LEN;
      // one bar of silence at the seam so the loop breathes
      const note = MELODY.find(([at]) => at === m);
      if (note) voiceAt(N[note[1]], t, STEP * note[2] * 0.94, {
        type: 'square', vol: 0.30, vibrato: note[2] >= 4 ? 4 : 0,
      });
    }

    if (withStabs) {
      const k = (i - STABS_IN) % STABS_LEN;
      const stab = STABS.find(([at]) => at === k);
      // Three voices at once, so each stays quiet — together they read as one
      // chord rather than three competing leads.
      if (stab) stab[1].forEach(n => voiceAt(N[n], t, STEP * 1.15, { type: 'square', vol: 0.085 }));
    }
  }

  function startLoading() {
    boot(); stopLoading();
    step = 0;
    nextStepTime = ctx.currentTime + 0.06;
    const pump = () => {
      // schedule everything due in the next 200ms, then hand back control
      while (nextStepTime < ctx.currentTime + 0.2) {
        scheduleStep(step++, nextStepTime);
        nextStepTime += STEP;
      }
    };
    pump();
    loadingTimer = setInterval(pump, 40);
  }
  function stopLoading() { clearInterval(loadingTimer); loadingTimer = null; }

  /* ---- one-shots ---- */
  const sfx = {
    blip:    () => voice(N['D5'], 0, 0.035, { type: 'square', vol: 0.09 }),
    hover:   () => voice(N['A4'], 0, 0.04,  { type: 'square', vol: 0.08 }),
    // Shot-clock pips. tick from ten seconds out, tickHot for the last five —
    // a fifth higher and twice as loud, so the change is heard rather than counted.
    tick:    () => voice(N['A4'], 0, 0.028, { type: 'square', vol: 0.075 }),
    tickHot: () => { voice(N['E5'], 0, 0.045, { type: 'square', vol: 0.17 }); noise(0, 0.02, { vol: 0.05, hp: 4000 }); },
    select:  () => { voice(N['D5'], 0, 0.06, { vol: 0.3 }); voice(N['A5'], 0.06, 0.12, { vol: 0.3 }); },
    confirm: () => { ['D5','F#5','A5','D6'].forEach((n, i) => voice(N[n], i * 0.055, 0.14, { vol: 0.32 })); },
    thud:    () => { voice(N['D3'], 0, 0.22, { type: 'triangle', vol: 0.4, slide: 0.5 }); noise(0, 0.14, { vol: 0.22, hp: 400 }); },
    win:     () => { ['D5','F#5','A5','D6','A5','D6','F#6','A6'].forEach((n, i) => voice(N[n], i * 0.1, 0.3, { vol: 0.34, vibrato: i > 5 ? 6 : 0 })); [0,.2,.4].forEach(t => noise(t, 0.1, { vol: 0.2 })); },
    lose:    () => { ['A4','G4','F4','E4','D4','C#4','C4','B3'].forEach((n, i) => voice(N[n], i * 0.12, 0.24, { type: 'square', vol: 0.3 })); voice(N['D3'], 1.0, 0.7, { type: 'triangle', vol: 0.4, slide: 0.5 }); },
  };

  return {
    boot, startTheme, stopTheme, startLoading, stopLoading, sfx,
    get loadBars() { return Math.floor(step / OST_BAR); },
    toggle() { muted = !muted; if (muted) { stopLoading(); stopTheme(); if (master) master.gain.value = 0; } else if (master) master.gain.value = 0.30; return muted; },
    get muted() { return muted; },
  };
})();

/* =========================================================================
   VOICE — the prison PA system, via the browser's own speech synthesiser.
   No audio files and no API calls: every platform ships voices, they just
   disagree about what they're called and load them on their own schedule.
   ========================================================================= */
const Speech = (() => {
  let voice = null;

  function pick() {
    if (!window.speechSynthesis) return null;
    const all = speechSynthesis.getVoices() || [];
    if (!all.length) return null;                 // often empty on first call
    // Always English, whatever the interface language is set to: the punk's
    // lines are deliberately English and an English voice is what reads them.
    const en = all.filter(v => /^en\b|^en[-_]/i.test(v.lang || ''));
    const pool = en.length ? en : all;
    // Names are the only reliable gender signal, and they vary by platform:
    // Daniel/Alex/Fred on Apple, David/Guy/Ryan on Windows, "... Male" on Chrome.
    const male = /\bmale\b|daniel|alex|fred|arthur|george|david|guy|ryan|rishi|oliver/i;
    return pool.find(v => male.test(v.name) && !/female/i.test(v.name)) || pool[0];
  }

  function init() {
    try {
      if (!window.speechSynthesis) return;
      voice = pick();
      // Chrome populates the list asynchronously, so retry when it tells us.
      if (!voice) speechSynthesis.addEventListener('voiceschanged', () => { voice = pick(); }, { once: true });
    } catch { /* no voice is a shame, not a failure */ }
  }

  return {
    init,
    /**
     * Never allowed to throw. say() is called synchronously from the middle of
     * a stage, so an unhappy speech engine — a rejected voice object, a platform
     * quirk, a policy block — must cost the flavour and nothing else. Losing an
     * attempt because the narrator cleared its throat would be absurd.
     */
    say(text) {
      try {
        if (!window.speechSynthesis || Chip.muted || !text) return;
        if (!voice) voice = pick();
        speechSynthesis.cancel();   // one line at a time; never build a queue
        const u = new SpeechSynthesisUtterance(String(text));
        u.lang = 'en-GB';
        if (voice) {
          try { u.voice = voice; if (/^en/i.test(voice.lang || '')) u.lang = voice.lang; }
          catch { /* engine refused the voice; the default one still speaks */ }
        }
        u.pitch = 0.6;              // dropped well below natural — reads as machine
        u.rate = 0.95;
        speechSynthesis.speak(u);
      } catch (e) {
        console.warn('speech unavailable:', e && e.message);
      }
    },
    stop() { try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch { /* nothing to stop */ } },
  };
})();

/* =========================================================================
   LANGUAGE — interface chrome only. The punk's asks and the judge's one-line
   reactions arrive in English on purpose: an English voice reads them aloud.
   ========================================================================= */
const Lang = (() => {
  // Just enough English to stay playable if /i18n.js is blocked or missing.
  const BARE = {
    lang_prompt: 'LANGUAGE', title_start: 'BREAK HIM OUT',
    title_tag: 'HE CAN’T REACH ANYTHING. YOU CAN.', title_foot: 'FIND IT · SHOOT IT · GET OUT',
    gate_title: 'RESTRICTED AREA', gate_hint: 'ACCESS CODE', gate_go: 'UNLOCK',
    cam_title: 'CAMERA CHECK',
    cam_why: 'This game is played with the camera on the back of your phone.',
    cam_privacy: 'Photos are looked at once, then thrown away.',
    cam_allow: 'TURN ON THE CAMERA', cam_denied: 'No camera, no problem.',
    cam_pick: 'CHOOSE A PHOTO', cam_retry: 'TRY THE CAMERA AGAIN',
    hud_stage: 'STAGE {n}/{total}', brief_go: 'OPEN CAMERA', cam_shoot: 'SHOOT IT',
    cam_switch: 'PICK A PHOTO INSTEAD', cam_hint: 'HOLD IT UP AND FILL THE FRAME',
    judging: 'DEVELOPING', judging_notes: ['HE’S HAVING A LOOK...'],
    verdict_pass: 'THAT’LL DO', verdict_fail: 'NOT A CHANCE',
    verdict_unreadable: 'CAN’T SEE IT', verdict_error: 'HOLD ON',
    verdict_timeout: 'OUT OF TIME',
    free_retry: 'FREE GO — THAT ONE DIDN’T COUNT', attempts_left: '{n} LEFT',
    last_chance: 'LAST CHANCE', retry: 'GO AGAIN', onward: 'GO ON THEN',
    caught_title: 'CAUGHT', caught_sub: 'Three strikes and the guard was already behind you.',
    caught_far: 'YOU GOT TO {scene}', escaped_title: 'OUT!',
    escaped_sub: 'Seven rooms, seven things you found lying around.', restart: 'GO AGAIN',
    evidence_title: 'THE EVIDENCE', evidence_tap: 'WHAT YOU ACTUALLY HANDED HIM',
    err_system: 'SYSTEM ERROR', err_camera: 'CAMERA UNAVAILABLE',
    err_try: 'TRY AGAIN', err_new: 'START A NEW RUN',
  };
  let code = 'en';
  const all = () => (window.I18N && window.I18N.strings) || { en: BARE };
  const dict = () => all()[code] || all().en || BARE;

  return {
    get code() { return code; },
    get locale() {
      const hit = this.list().find(l => l.code === code);
      return (hit && hit.locale) || code || 'en';
    },
    list() {
      return (window.I18N && window.I18N.langs) || [{ code: 'en', label: 'ENGLISH', locale: 'en-GB' }];
    },
    set(next) {
      code = this.list().some(l => l.code === next) ? next : 'en';
      document.body.dataset.lang = code;          // drives the font swap in CSS
      document.documentElement.lang = code;
    },
    notes() { return dict().judging_notes || BARE.judging_notes; },
    t(key, vars) {
      let out = dict()[key];
      if (out === undefined) out = (all().en || BARE)[key];
      if (out === undefined) out = BARE[key] !== undefined ? BARE[key] : key;
      out = String(out);
      if (vars) for (const k in vars) out = out.split('{' + k + '}').join(vars[k]);
      return out;
    },
    /** Locale-aware casing. Turkish 'i' uppercases to 'İ', not 'I'. */
    up(s) {
      try { return String(s).toLocaleUpperCase(this.locale); }
      catch { return String(s).toUpperCase(); }
    },
  };
})();

/* =========================================================================
   ANALYTICS — additive JailbreakCamera.* events only.
   This app has its own prefix and its own $app_name, so nothing it sends
   touches, renames or redefines any event belonging to another product.
   Inert unless the server hands over a key, and never allowed to throw:
   losing an attempt to a blocked analytics script would be absurd.
   ========================================================================= */
const Analytics = (() => {
  const APP = 'JailbreakCamera';
  let ready = false;

  function load(host) {
    return new Promise(resolve => {
      const el = document.createElement('script');
      el.src = String(host).replace(/\/+$/, '') + '/static/array.js';
      el.async = true;
      el.onload = () => resolve(true);
      el.onerror = () => resolve(false);   // ad-blocked: carry on silently
      document.head.appendChild(el);
    });
  }

  return {
    async init(cfg) {
      try {
        if (!cfg || !cfg.key) return;                    // no key = no tracking
        if (!(await load(cfg.host))) return;
        if (!window.posthog || !window.posthog.init) return;
        window.posthog.init(cfg.key, {
          api_host: cfg.host,
          autocapture: false,        // a handful of screens; the custom events are the signal
          capture_pageview: false,
          capture_pageleave: true,
          persistence: 'localStorage+cookie',
        });
        // $app_name is autocaptured by the mobile SDKs but not on web. Setting it
        // is what keeps this prototype's traffic separable from every other app.
        window.posthog.register({ $app_name: APP });
        ready = true;
      } catch (e) { console.warn('analytics off:', e && e.message); }
    },
    capture(name, props, opts) {
      try {
        if (!ready || !window.posthog) return;
        window.posthog.capture(APP + '.' + name,
          Object.assign({ language_code: Lang.code }, props || {}), opts);
      } catch { /* never costs an attempt */ }
    },
    register(props) { try { if (ready && window.posthog) window.posthog.register(props || {}); } catch {} },
    unregister(key) { try { if (ready && window.posthog) window.posthog.unregister(key); } catch {} },
  };
})();

/* =========================================================================
   SCREENS + TEXT
   ========================================================================= */
const $ = id => document.getElementById(id);

function show(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 'screen-' + name));
  window.scrollTo(0, 0);
}

/** Fills every [data-t] from the current language. Called again on a switch. */
function applyText(root) {
  (root || document).querySelectorAll('[data-t]').forEach(el => {
    el.textContent = Lang.t(el.dataset.t);
  });
}

function buildLangs() {
  const host = $('langs');
  host.innerHTML = '';
  Lang.list().forEach(l => {
    const b = document.createElement('button');
    b.className = 'lang-chip' + (l.code === Lang.code ? ' on' : '');
    b.textContent = l.label;
    b.addEventListener('click', () => {
      Chip.sfx.blip();
      Lang.set(l.code);
      buildLangs();
      applyText(document);
    });
    host.appendChild(b);
  });
}

/** A line the punk says out loud, with a tap-to-hear affordance. */
function speakable(text) {
  const wrap = document.createElement('div');
  wrap.dataset.say = '';
  const line = document.createElement('span');
  line.className = 'line';
  line.textContent = text;
  const icon = document.createElement('span');
  icon.className = 'say';
  icon.textContent = '🔊';
  icon.title = Lang.t('say_hint');
  wrap.append(line, icon);
  return wrap;
}

document.addEventListener('click', e => {
  const host = e.target.closest('[data-say]');
  if (!host) return;
  const line = host.querySelector('.line');
  Speech.say((line || host).textContent);
});

/* =========================================================================
   CAMERA

   Two capture paths, and the game is completable on either. getUserMedia gives
   the live viewfinder, which is the good version. The file input is the
   fallback when it is unavailable or refused — on a phone, capture="environment"
   still opens the rear camera, so mobile players lose the viewfinder and
   nothing else. Desktop players get a file picker.

   Everything here needs https. On http the browser will simply refuse, which
   is why the dev loop for this game runs through the deployed URL or a tunnel.
   ========================================================================= */
const Camera = (() => {
  let stream = null;
  let mode = 'live';           // 'live' | 'file'
  // Sticky for the page's lifetime. The stream is stopped between runs so the
  // recording indicator goes out, but the permission itself doesn't come back —
  // so a replay should never make the player agree to the camera twice.
  let granted = false;

  async function attach() {
    if (mode === 'file') return false;
    const video = $('video');
    if (stream && stream.active && video.srcObject === stream) return true;
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no getUserMedia');
      stream = await navigator.mediaDevices.getUserMedia({
        // A phone has a rear camera and that is the one that can see the room.
        // On a laptop this constraint is simply ignored and the webcam is used.
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 1280 } },
        audio: false,
      });
      video.srcObject = stream;
      // Some browsers need the play() even with autoplay set, and reject it
      // outside a gesture — which is exactly why this runs off a button.
      try { await video.play(); } catch { /* autoplay policy; the stream is still live */ }
      granted = true;
      return true;
    } catch (e) {
      console.warn('camera unavailable:', e && e.message);
      Analytics.capture('camera_denied', { reason: (e && e.name) || 'unknown' });
      stream = null;
      return false;
    }
  }

  function stop() {
    try { if (stream) stream.getTracks().forEach(t => t.stop()); } catch { /* already gone */ }
    stream = null;
    const v = $('video');
    if (v) v.srcObject = null;
  }

  /**
   * Downscale on the way out. 768px on the longest edge is plenty for "what is
   * this object" and keeps a photo around 60–120KB, which matters on a phone
   * connection and keeps us well under the server's size cap.
   */
  function encode(source, w, h) {
    if (!w || !h) return null;
    const MAX = 768;
    const scale = Math.min(1, MAX / Math.max(w, h));
    const c = $('canvas');
    c.width = Math.round(w * scale);
    c.height = Math.round(h * scale);
    const ctx = c.getContext('2d');
    ctx.drawImage(source, 0, 0, c.width, c.height);
    return { dataURL: c.toDataURL('image/jpeg', 0.7), mime: 'image/jpeg' };
  }

  return {
    get mode() { return mode; },
    set mode(m) { mode = m; },
    get live() { return !!(stream && stream.active); },
    get granted() { return granted; },
    attach, stop,
    /** Grab the current viewfinder frame. */
    capture() {
      const v = $('video');
      return encode(v, v.videoWidth, v.videoHeight);
    },
    /** Same, from a chosen file. */
    fromFile(file) {
      return new Promise(resolve => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { const out = encode(img, img.naturalWidth, img.naturalHeight); URL.revokeObjectURL(url); resolve(out); };
        img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
        img.src = url;
      });
    },
  };
})();

/* =========================================================================
   GAME
   ========================================================================= */
let S = null;            // the server's view of the run
let health = {};
let judged = null;       // the stage the in-flight photo belongs to
let judgedAttempt = 0;   // which of its three goes this photo is
let busy = false;        // one photo in the air at a time
let noteTimer = null;

async function api(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  const data = await res.json().catch(() => ({ error: 'The server said something unreadable.' }));
  if (!res.ok) throw Object.assign(new Error(data.error || `HTTP ${res.status}`), { status: res.status });
  return data;
}

let toastTimer = null;
/**
 * For the things that go wrong without ending anything: an image we couldn't
 * decode, a camera that dropped out mid-run. The error SCREEN offers a new run,
 * which would be an absurd punishment for picking the wrong file.
 */
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.remove('hide');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hide'), 4200);
  Chip.sfx.thud();
}

function fail(e, titleKey) {
  console.error(e);
  Clock.stop();
  Chip.stopLoading();
  stopNotes();
  busy = false;
  $('err-title').textContent = Lang.t(titleKey || 'err_system');
  $('err-body').textContent = (e && e.message) || String(e);
  show('error');
}

/* ---- the attempts counter, as tally marks scratched on the wall ---- */
function renderTally(host) {
  if (!host || !S) return;
  const total = S.attemptsPerStage || 3;
  const left = Math.max(0, S.attemptsLeft);
  host.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const m = document.createElement('span');
    // Spent goes are struck through; the one you are on blinks amber.
    const spent = i < total - left;
    m.className = 'mark' + (spent ? ' spent' : i === total - left ? ' now' : '');
    host.appendChild(m);
  }
}

function paintHud(stagePrefix) {
  const st = S.stage;
  $(stagePrefix + '-stage').textContent = Lang.t('hud_stage', { n: S.stageNumber, total: S.totalStages });
  $(stagePrefix + '-scene').textContent = st ? Lang.up(st.scene) : '';
  renderTally($(stagePrefix + '-tally'));
}

/* ---- boot ---- */
async function boot() {
  Speech.init();
  Lang.set('en');
  buildLangs();
  applyText(document);

  try { health = await (await fetch('/api/health')).json(); }
  catch (e) { health = {}; }
  Analytics.init(health.posthog);
  Analytics.register({ mock_mode: !!health.mock });

  if (health.gated && !health.unlocked) { show('gate'); $('code').focus(); return; }
  show('title');
}

async function unlock() {
  const code = $('code').value.trim();
  $('code-err').textContent = '';
  if (!code) return;
  $('unlock').disabled = true;
  try {
    await api('/api/unlock', { code });
    Chip.boot(); Chip.sfx.confirm();
    show('title');
  } catch (e) {
    $('code-err').textContent = e.message;
    Chip.sfx.thud();
  } finally {
    $('unlock').disabled = false;
  }
}

/** ?stage=4 jumps straight in, for testing stage 5 without playing four stages. */
function devStage() {
  const n = Number(new URLSearchParams(location.search).get('stage'));
  return Number.isInteger(n) && n > 0 ? n : undefined;
}

/**
 * ?verdict=fail forces every judgement, so the caught screen and the free-retry
 * path can be walked without hunting for the wrong object. Honoured by the
 * server in MOCK mode only, so it does nothing on a deployed build with a key.
 */
function devVerdict() {
  const v = new URLSearchParams(location.search).get('verdict');
  return ['pass', 'fail', 'unreadable'].includes(v) ? v : undefined;
}

async function startRun() {
  Chip.boot();
  Chip.sfx.confirm();
  $('start').disabled = true;
  try {
    S = await api('/api/start', { lang: Lang.code, startAt: devStage() });
  } catch (e) {
    return fail(e);
  } finally {
    $('start').disabled = false;
  }
  Analytics.capture('run_started', { stages: S.totalStages, resumed_at: S.stageNumber });
  // Straight past the primer if this player has already agreed to the camera, or
  // has chosen the file route. Only a first run should see it.
  if (Camera.granted || Camera.mode === 'file') {
    if (Camera.granted && !Camera.live) await Camera.attach();
    return brief();
  }
  show('primer');
}

async function requestCamera() {
  $('allow').disabled = true;
  const ok = await Camera.attach();
  $('allow').disabled = false;
  if (ok) { Chip.sfx.select(); return brief(); }
  // Refused or unavailable. Say so, and offer the route that still works.
  Chip.sfx.thud();
  $('primer-fallback').classList.remove('hide');
  $('allow').classList.add('hide');
}

/* ---- stage brief ---- */
/**
 * A holding frame for a stage whose diorama hasn't been generated yet. Reads as
 * deliberately unfinished — bars on charcoal, room named — rather than
 * pretending to be art.
 */
function placeholderArt(st) {
  const ph = document.createElement('div');
  ph.className = 'stage-ph';
  const name = document.createElement('div');
  name.className = 'ph-name';
  name.textContent = Lang.up(st.scene);
  const note = document.createElement('div');
  note.className = 'ph-note';
  note.textContent = 'ART PENDING';
  ph.append(name, note);
  return ph;
}

function renderArt(host, st) {
  host.innerHTML = '';
  // The server only sends a path when the PNG is really there, so a missing
  // diorama never costs a failed request. `npm run art` fills them in.
  if (!st.art) {
    host.appendChild(placeholderArt(st));
  } else {
    const img = document.createElement('img');
    img.alt = st.scene;
    img.src = st.art;
    img.addEventListener('error', () => img.replaceWith(placeholderArt(st)));
    host.appendChild(img);
  }

  const bubble = speakable(st.ask);
  bubble.className = 'bubble';
  host.appendChild(bubble);
}

function brief() {
  if (!S.stage) return ending(null);
  paintHud('brief');
  renderArt($('brief-art'), S.stage);
  show('brief');
  Speech.say(S.stage.ask);
  Analytics.capture('stage_started', { stage: S.stage.id, stage_number: S.stageNumber });
}

/* ---- camera ---- */
async function openCamera() {
  Chip.sfx.select();
  if (Camera.mode === 'file') return $('file').click();
  const ok = await Camera.attach();
  if (!ok) {
    Camera.mode = 'file';
    Analytics.capture('camera_fallback_used', {});
    toast(Lang.t('cam_denied'));
    return $('file').click();
  }
  paintHud('cam');
  const ask = $('cam-ask');
  ask.innerHTML = '';
  ask.appendChild(speakable(S.stage.ask).firstChild.cloneNode(true));
  const icon = document.createElement('span');
  icon.className = 'say';
  icon.textContent = '🔊';
  ask.appendChild(icon);
  show('cam');
  Clock.start(S.shotSeconds, timeUp);
}

async function shoot() {
  if (busy) return;
  const shot = Camera.capture();
  if (!shot) return toast('The camera gave us an empty frame — try again.');
  Clock.stop();
  Chip.sfx.blip();
  submit(shot);
}

/**
 * The clock hit zero. Show whatever the viewfinder was pointing at when it did —
 * it costs nothing, and an empty panel reads as a bug where a stamped frame reads
 * as "that's what you had". Falls back to the panel if the grab fails.
 */
async function timeUp() {
  if (busy) return;
  busy = true;
  const shot = Camera.capture();
  Chip.sfx.lose();
  let out;
  try {
    out = await api('/api/timeout', { sessionId: S.sessionId });
  } catch (e) {
    busy = false;
    return fail(e);
  }
  busy = false;
  verdict(out, shot);
}

async function onFile(e) {
  Clock.stop();
  const input = e.target;
  const file = input.files && input.files[0];
  if (!file || busy) { input.value = ''; return; }
  let shot = null;
  try {
    shot = await Camera.fromFile(file);
  } finally {
    // Cleared only after the file has been read, not before: clearing the input
    // can drop the browser's handle on the underlying blob, and then a perfectly
    // good photo fails to decode. Doing it at all is what lets the player pick
    // the same file twice in a row and still get a change event.
    input.value = '';
  }
  // Not an error screen: they picked a file we couldn't decode, which costs them
  // nothing and shouldn't cost them the run either.
  if (!shot) return toast("Couldn't read that one — try another photo.");
  Chip.sfx.blip();
  submit(shot);
}

/* =========================================================================
   THE SHOT CLOCK

   Thirty seconds from the viewfinder opening to the shutter. Running out costs
   an attempt, same as a wrong object — one currency, so the tally marks stay
   the only thing the player has to keep an eye on.

   Two deliberate exemptions. It does not run in file-picker mode: the OS photo
   picker is a modal sheet over the whole screen, and a clock draining behind it
   that the player cannot see is a trap rather than a challenge. And it pauses
   when the tab goes away, so coming back to a dead run can't happen.
   ========================================================================= */
const Clock = (() => {
  let timer = null, left = 0, total = 30, onExpire = null, paused = false;

  function paint() {
    const el = $('clock');
    $('clock-num').textContent = left;
    $('clock-fill').style.width = Math.max(0, (left / total) * 100) + '%';
    el.classList.toggle('warn', left <= 10 && left > 5);
    el.classList.toggle('hot', left <= 5);
  }

  function beat() {
    if (paused) return;
    left -= 1;
    paint();
    if (left <= 5 && left > 0) Chip.sfx.tickHot();
    else if (left <= 10 && left > 0) Chip.sfx.tick();
    if (left <= 0) {
      stop();
      if (onExpire) onExpire();
    }
  }

  function stop() {
    clearInterval(timer); timer = null; paused = false;
    $('clock').classList.add('hide');
    document.querySelector('.cam').classList.remove('timed');
  }

  return {
    get running() { return !!timer; },
    start(seconds, expired) {
      stop();
      total = Math.max(5, Number(seconds) || 30);
      left = total;
      onExpire = expired;
      paused = false;
      $('clock').classList.remove('hide', 'warn', 'hot');
      document.querySelector('.cam').classList.add('timed');
      // No transition on the first paint, or the bar visibly slides in from empty.
      $('clock-fill').style.transition = 'none';
      paint();
      requestAnimationFrame(() => { $('clock-fill').style.transition = ''; });
      timer = setInterval(beat, 1000);
    },
    stop,
    pause() { if (timer) paused = true; },
    resume() { paused = false; },
  };
})();

/* ---- the judge ---- */
function startNotes() {
  const notes = Lang.notes();
  let i = 0;
  $('judge-note').textContent = notes[0] || '';
  stopNotes();
  noteTimer = setInterval(() => { $('judge-note').textContent = notes[++i % notes.length]; }, 1600);
}
function stopNotes() { clearInterval(noteTimer); noteTimer = null; }

async function submit(shot) {
  busy = true;
  Clock.stop();
  judged = S.stage;
  judgedAttempt = (S.attemptsPerStage - S.attemptsLeft) + 1;

  const host = $('judge-shot');
  host.innerHTML = '';
  host.classList.add('busy');
  const img = new Image();
  img.src = shot.dataURL;
  host.appendChild(img);
  startNotes();
  show('judge');
  Chip.startLoading();
  Analytics.capture('photo_submitted', { stage: judged.id, stage_number: S.stageNumber, attempt: judgedAttempt });

  let out;
  try {
    out = await api('/api/judge', { sessionId: S.sessionId, image: shot.dataURL, mime: shot.mime, force: devVerdict() });
  } catch (e) {
    busy = false;
    return fail(e);
  } finally {
    Chip.stopLoading();
    stopNotes();
  }
  busy = false;
  verdict(out, shot);
}

function verdict(out, shot) {
  const kind = out.verdict;               // pass | fail | unreadable | error | timeout
  // Anything that actually cost an attempt. A timeout costs one; an unreadable
  // photo or a wobbly API call do not.
  const wasted = kind === 'fail' || kind === 'timeout';
  S = Object.assign({}, S, out);

  Analytics.capture('verdict', {
    stage: judged.id, stage_number: out.stageNumber, verdict: kind,
    object: out.object, confidence: out.confidence, latency_ms: out.latencyMs,
  });
  if (kind === 'pass') Analytics.capture('stage_passed', { stage: judged.id, attempts_used: judgedAttempt });
  if (wasted && out.over !== 'caught') Analytics.capture('stage_failed', { stage: judged.id, attempt: judgedAttempt, attempts_left: out.attemptsLeft, timed_out: kind === 'timeout' });

  // Caught or out: the ending screen carries the punk's last line, so the run
  // doesn't stop on a verdict card and then stop again on a result card.
  if (out.over) return ending(out);

  paintHud('v');
  const host = $('v-shot');
  host.innerHTML = '';
  host.classList.remove('busy');
  host.classList.toggle('empty', !shot);
  const stamp = document.createElement('div');
  stamp.className = 'stamp ' + (kind === 'pass' ? 'pass' : wasted ? 'fail' : 'soft');
  stamp.textContent = Lang.t('verdict_' + (kind === 'error' ? 'error' : kind));
  if (shot) {
    const img = new Image();
    img.src = shot.dataURL;
    host.append(img, stamp);
  } else {
    const none = document.createElement('span');
    none.className = 'none';
    none.textContent = 'NO PHOTO';
    host.append(none, stamp);
  }

  const line = $('v-line');
  line.innerHTML = '';
  line.append(speakable(out.reason).firstChild.cloneNode(true));
  const icon = document.createElement('span');
  icon.className = 'say';
  icon.textContent = '🔊';
  line.appendChild(icon);

  // An unreadable photo or a wobbly API call cost nothing, and the player is
  // told so plainly — otherwise it looks like the counter is broken.
  $('v-free').classList.toggle('hide', wasted || kind === 'pass');
  const go = $('v-go');
  go.textContent = kind === 'pass' ? Lang.t('onward')
    : S.attemptsLeft === 1 && wasted ? Lang.t('last_chance')
    : Lang.t('retry');
  go.dataset.next = kind === 'pass' ? 'brief' : 'cam';

  // The timeout already played its own sting on the way in; don't stack another.
  if (kind !== 'timeout') Chip.sfx[kind === 'pass' ? 'confirm' : wasted ? 'thud' : 'blip']();
  Speech.say(out.reason);
  show('verdict');
}

/* ---- endings ---- */
function ending(out) {
  const won = S.over === 'escaped';
  Clock.stop();
  Camera.stop();
  Chip.stopLoading();

  $('end-verdict').textContent = Lang.t(won ? 'escaped_title' : 'caught_title');
  $('end-verdict').className = 'verdict ' + (won ? 'win' : 'lose');

  // The punk's last line, the narrator's line and the stat are three different
  // voices. Running them into one paragraph made all three read worse.
  const line = $('end-line');
  line.innerHTML = '';
  if (out && out.reason) {
    line.classList.remove('hide');
    line.append(speakable(out.reason).firstChild.cloneNode(true));
    const icon = document.createElement('span');
    icon.className = 'say';
    icon.textContent = '🔊';
    line.appendChild(icon);
  } else {
    line.classList.add('hide');
  }
  $('end-sub').textContent = Lang.t(won ? 'escaped_sub' : 'caught_sub');
  $('end-got').textContent = !won && judged ? Lang.t('caught_far', { scene: Lang.up(judged.scene) }) : '';

  const items = (S.evidence || []);
  $('end-loot').classList.toggle('hide', !items.length);
  const grid = $('end-grid');
  grid.innerHTML = '';
  items.forEach(it => {
    const card = document.createElement('button');
    card.className = 'loot-item';
    card.dataset.say = '';
    const where = document.createElement('span');
    where.className = 'where';
    where.textContent = Lang.up(it.scene);
    const what = document.createElement('span');
    what.className = 'what line';
    what.textContent = it.object;
    card.append(where, what);
    grid.appendChild(card);
  });

  Chip.sfx[won ? 'win' : 'lose']();
  Speech.say(out && out.reason ? out.reason : '');
  show('end');
  Analytics.capture(won ? 'run_escaped' : 'run_caught', {
    stage_reached: judged ? judged.id : null,
    stage_number: S.stageNumber,
    objects_found: items.length,
    duration_ms: out ? out.durationMs : null,
  });
}

/* =========================================================================
   WIRING
   ========================================================================= */
$('mute').addEventListener('click', () => {
  const muted = Chip.toggle();
  if (muted) Speech.stop();
  $('mute').textContent = muted ? '♪̶' : '♪';
});

$('unlock').addEventListener('click', unlock);
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

$('start').addEventListener('click', startRun);
$('allow').addEventListener('click', requestCamera);
$('cam-retry').addEventListener('click', () => {
  $('primer-fallback').classList.add('hide');
  $('allow').classList.remove('hide');
  requestCamera();
});
$('pick-instead').addEventListener('click', () => {
  Camera.mode = 'file';
  Analytics.capture('camera_fallback_used', {});
  brief();
});

$('brief-go').addEventListener('click', openCamera);
$('shoot').addEventListener('click', shoot);
$('use-file').addEventListener('click', () => { Camera.mode = 'file'; $('file').click(); });
$('file').addEventListener('change', onFile);
$('v-go').addEventListener('click', () => {
  Chip.sfx.select();
  if ($('v-go').dataset.next === 'brief') brief(); else openCamera();
});
$('end-again').addEventListener('click', () => { Speech.stop(); startRun(); });
$('err-again').addEventListener('click', () => { Speech.stop(); show('title'); });

// Space is the shutter, and only that — nothing else on this screen wants it.
document.addEventListener('keydown', e => {
  if (e.key !== ' ' && e.key !== 'Enter') return;
  if (document.activeElement && /INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)) return;
  const open = document.querySelector('.screen.on');
  if (!open) return;
  e.preventDefault();
  if (open.id === 'screen-cam') shoot();
  else if (open.id === 'screen-brief') openCamera();
  else if (open.id === 'screen-verdict') $('v-go').click();
});

// Release the camera when the tab goes away, so the recording indicator goes
// out, and pick it back up on return if the viewfinder is what's on screen.
document.addEventListener('visibilitychange', () => {
  // The clock pauses rather than stops: a phone call or a notification shouldn't
  // burn an attempt, and it shouldn't hand out free time either.
  if (document.hidden) { Clock.pause(); Camera.stop(); Speech.stop(); return; }
  const open = document.querySelector('.screen.on');
  if (open && open.id === 'screen-cam') { Camera.attach(); Clock.resume(); }
});

// Best-effort: tell the server a run is done with, rather than leaving it to
// time out. sendBeacon is the only thing that reliably survives a page unload.
window.addEventListener('pagehide', () => {
  try {
    if (S && S.sessionId && navigator.sendBeacon) {
      navigator.sendBeacon('/api/abandon', new Blob([JSON.stringify({ sessionId: S.sessionId })], { type: 'application/json' }));
    }
  } catch { /* nothing to do about it */ }
});

boot();
</script>
</body>
</html>
